<header>Introducción a Regresión Lineal</header>
<p class="cover-title">Ajustar una regresión lineal</p>
<footer>Aprendizaje Estadístico</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-header="Introducción a Regresión Lineal" data-footer="Aprendizaje Estadístico" data-paginate="true" data-theme="lecture" data-marpit-pagination="2" data-marpit-pagination-total="89" style="--header:Introducción a Regresión Lineal;--footer:Aprendizaje Estadístico;--paginate:true;--theme:lecture;">
<header>Introducción a Regresión Lineal</header>
<h1 id="definici%C3%B3n-e-importancia">Definición e importancia</h1>
<ul>
<li>
<p>La regresión lineal es un método de aprendizaje supervisado, lo que significa que utiliza datos etiquetados —donde las características de entrada y las respuestas correspondientes son conocidas para un subconjunto de datos— para predecir una respuesta cuantitativa a partir de una o más variables independientes.</p>
</li>
<li>
<p>Este modelo se aplica luego para realizar predicciones sobre datos nuevos y desconocidos.</p>
</li>
</ul>
<footer>Aprendizaje Estadístico</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-header="Introducción a Regresión Lineal" data-footer="Aprendizaje Estadístico" data-paginate="true" data-theme="lecture" data-marpit-pagination="3" data-marpit-pagination-total="89" style="--header:Introducción a Regresión Lineal;--footer:Aprendizaje Estadístico;--paginate:true;--theme:lecture;">
<header>Introducción a Regresión Lineal</header>
<h2 id="ejemplos-de-casos-de-uso-del-mundo-real">Ejemplos de casos de uso del mundo real</h2>
<ul>
<li>Organizaciones de marketing que predicen ingresos por ventas basándose en los gastos publicitarios a través de múltiples canales.</li>
<li>Compradores y prestamistas que predicen los precios futuros de las viviendas basándose en el tamaño y los metros cuadrados, número de habitaciones y baños, edad y condición de la propiedad, diseño arquitectónico y tamaño del lote.</li>
<li>Oficiales de admisiones universitarias que predicen el rendimiento de los estudiantes basándose en los GPA de la escuela secundaria y los puntajes de las pruebas estandarizadas.</li>
<li>Minoristas que predicen la demanda de productos basándose en cifras históricas de ventas.</li>
</ul>
<footer>Aprendizaje Estadístico</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-header="Introducción a Regresión Lineal" data-footer="Aprendizaje Estadístico" data-paginate="true" data-theme="lecture" data-marpit-pagination="4" data-marpit-pagination-total="89" style="--header:Introducción a Regresión Lineal;--footer:Aprendizaje Estadístico;--paginate:true;--theme:lecture;">
<header>Introducción a Regresión Lineal</header>
<h1 id="modelado-y-relaciones-lineales">Modelado y relaciones lineales</h1>
<ul>
<li>Cualquier relación entre variables independientes y dependientes —es decir, entre predictores que explican el cambio y los resultados que afectan— que muestre un patrón lineal en el espacio de características dado puede modelarse con regresión lineal.</li>
<li>Aunque métodos más complejos pueden transformar los datos para modelar relaciones no lineales, la regresión lineal está diseñada para capturar relaciones que se alinean bien con una línea recta a través de los datos.</li>
</ul>
<footer>Aprendizaje Estadístico</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-header="Introducción a Regresión Lineal" data-footer="Aprendizaje Estadístico" data-paginate="true" data-theme="lecture" data-marpit-pagination="5" data-marpit-pagination-total="89" style="--header:Introducción a Regresión Lineal;--footer:Aprendizaje Estadístico;--paginate:true;--theme:lecture;">
<header>Introducción a Regresión Lineal</header>
<h2 id="preguntas-clave-al-ajustar-una-regresi%C3%B3n-lineal">Preguntas clave al ajustar una regresión lineal</h2>
<ul>
<li>¿Existe una relación significativa entre las variables independientes, también conocidas como variables explicativas o predictoras, y una variable dependiente, conocida como variable objetivo o de respuesta?</li>
<li>¿Cuál es la naturaleza de la relación?</li>
<li>¿Qué tan fuerte es la relación?</li>
<li>¿Podemos estimar los cambios en una variable dependiente a partir de las varianzas en las variables independientes?</li>
<li>Al ajustar una regresión lineal múltiple, donde una variable de respuesta se modela frente a dos o más predictores, ¿qué predictores tienen una influencia estadísticamente significativa en los cambios de la variable de respuesta?</li>
<li>¿Qué tan bien se ajusta el modelo a los datos?</li>
</ul>
<footer>Aprendizaje Estadístico</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-header="Introducción a Regresión Lineal" data-footer="Aprendizaje Estadístico" data-paginate="true" data-theme="lecture" data-marpit-pagination="6" data-marpit-pagination-total="89" style="--header:Introducción a Regresión Lineal;--footer:Aprendizaje Estadístico;--paginate:true;--theme:lecture;">
<header>Introducción a Regresión Lineal</header>
<h1 id="la-regresi%C3%B3n-lineal">La regresión lineal</h1>
<ul>
<li>La regresión lineal, una vez más, es un método de aprendizaje supervisado popular y práctico para predicciones cuando la variable de respuesta es numérica.</li>
<li>Nunca se debe ajustar una regresión lineal cuando se intenta resolver <strong>un problema de clasificación</strong>, el cual implica predecir resultados categóricos como etiquetas o membresía a grupos.</li>
</ul>
<footer>Aprendizaje Estadístico</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-header="Introducción a Regresión Lineal" data-footer="Aprendizaje Estadístico" data-paginate="true" data-theme="lecture" data-marpit-pagination="7" data-marpit-pagination-total="89" style="--header:Introducción a Regresión Lineal;--footer:Aprendizaje Estadístico;--paginate:true;--theme:lecture;">
<header>Introducción a Regresión Lineal</header>
<ul>
<li>La regresión lineal es un método utilizado para modelar la relación entre una variable dependiente numérica y una o más variables independientes, que pueden o no ser también numéricas.</li>
<li>Asume una relación lineal entre las variables.</li>
<li>Nuestro propósito aquí es fundamentarlo completamente en todo lo relacionado con la regresión lineal antes de ajustar un modelo a un conjunto de datos real.</li>
</ul>
<footer>Aprendizaje Estadístico</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-header="Introducción a Regresión Lineal" data-footer="Aprendizaje Estadístico" data-paginate="true" data-theme="lecture" data-marpit-pagination="8" data-marpit-pagination-total="89" style="--header:Introducción a Regresión Lineal;--footer:Aprendizaje Estadístico;--paginate:true;--theme:lecture;">
<header>Introducción a Regresión Lineal</header>
<h2 id="ecuaci%C3%B3n-lineal-y-la-l%C3%ADnea-de-regresi%C3%B3n">Ecuación lineal y la línea de regresión</h2>
<ul>
<li>El propósito de la regresión lineal es medir la correlación entre las variables independientes y dependientes encontrando la línea de mejor ajuste que modela la relación bajo el supuesto de linealidad.</li>
</ul>
<h3 id="ecuaci%C3%B3n-de-regresi%C3%B3n-lineal-simple">Ecuación de regresión lineal simple</h3>

<header>Introducción a Regresión Lineal</header>
<h1 id="componentes-del-modelo-poblacional">Componentes del modelo poblacional</h1>
<ul>
<li><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.464ex;" xmlns="http://www.w3.org/2000/svg" width="1.109ex" height="1.464ex" role="img" focusable="false" viewBox="0 -442 490 647"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D466" d="M21 287Q21 301 36 335T84 406T158 442Q199 442 224 419T250 355Q248 336 247 334Q247 331 231 288T198 191T182 105Q182 62 196 45T238 27Q261 27 281 38T312 61T339 94Q339 95 344 114T358 173T377 247Q415 397 419 404Q432 431 462 431Q475 431 483 424T494 412T496 403Q496 390 447 193T391 -23Q363 -106 294 -155T156 -205Q111 -205 77 -183T43 -117Q43 -95 50 -80T69 -58T89 -48T106 -45Q150 -45 150 -87Q150 -107 138 -122T115 -142T102 -147L99 -148Q101 -153 118 -160T152 -167H160Q177 -167 186 -165Q219 -156 247 -127T290 -65T313 -9T321 21L315 17Q309 13 296 6T270 -6Q250 -11 231 -11Q185 -11 150 11T104 82Q103 89 103 113Q103 170 138 262T173 379Q173 380 173 381Q173 390 173 393T169 400T158 404H154Q131 404 112 385T82 344T65 302T57 280Q55 278 41 278H27Q21 284 21 287Z"></path></g></g></g></svg></mjx-container> es la variable dependiente observada (también llamada variable de respuesta o variable objetivo).</li>
<li><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="1.294ex" height="1.025ex" role="img" focusable="false" viewBox="0 -442 572 453"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D465" d="M52 289Q59 331 106 386T222 442Q257 442 286 424T329 379Q371 442 430 442Q467 442 494 420T522 361Q522 332 508 314T481 292T458 288Q439 288 427 299T415 328Q415 374 465 391Q454 404 425 404Q412 404 406 402Q368 386 350 336Q290 115 290 78Q290 50 306 38T341 26Q378 26 414 59T463 140Q466 150 469 151T485 153H489Q504 153 504 145Q504 144 502 134Q486 77 440 33T333 -11Q263 -11 227 52Q186 -10 133 -10H127Q78 -10 57 16T35 71Q35 103 54 123T99 143Q142 143 142 101Q142 81 130 66T107 46T94 41L91 40Q91 39 97 36T113 29T132 26Q168 26 194 71Q203 87 217 139T245 247T261 313Q266 340 266 352Q266 380 251 392T217 404Q177 404 142 372T93 290Q91 281 88 280T72 278H58Q52 284 52 289Z"></path></g></g></g></svg></mjx-container> es la variable independiente (también conocida como predictor o variable explicativa).</li>

1 367 173 396T287 430Q289 431 329 431H367Q382 426 382 411Q382 385 341 385H325H312Q191 385 154 277L150 265H327Q340 256 340 246Q340 228 320 219H138V217Q128 187 128 143Q128 77 160 52T231 26Q258 26 284 36T326 57T343 68Q350 68 354 58T358 39Q358 36 357 35Q354 31 337 21T289 0T227 -11Z"></path></g></g></g></svg></mjx-container>:</li>
</ul>

3 570Q573 465 469 396L482 383Q533 332 533 252Q533 139 448 65T257 -10Q227 -10 203 -2T165 17T143 40T131 59T126 65L62 -188Q60 -194 42 -194H29ZM353 431Q392 431 427 419L432 422Q436 426 439 429T449 439T461 453T472 471T484 495T493 524T501 560Q503 569 503 593Q503 611 502 616Q487 667 426 667Q384 667 347 643T286 582T247 514T224 455Q219 439 186 308T152 168Q151 163 151 147Q151 99 173 68Q204 26 260 26Q302 26 349 51T425 137Q441 171 449 214T457 279Q457 337 422 372Q380 358 347 358H337Q258 358 258 389Q258 396 261 403Q275 431 353 431Z"></path></g><g data-mml-node="mn" transform="translate(599,-150) scale(0.707)"><path data-c="30" d="M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 320Q39 494 96 585ZM321 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z"></path></g></g><g data-mml-node="mo" transform="translate(3048.3,0)"><path data-c="2B" d="M56 237T56 250T70 270H369V420L370 570Q380 583 389 583Q402 583 409 568V270H707Q722 262 722 250T707 230H409V-68Q401 -82 391 -82H389H387Q375 -82 369 -68V230H70Q56 237 56 250Z"></path></g><g data-mml-node="msub" transform="translate(4048.6,0)"><g data-mml-node="mi"><path data-c="1D6FD" d="M29 -194Q23 -188 23 -186Q23 -183 102 134T186 465Q208 533 243 584T309 658Q365 705 429 705H431Q493 705 533 667T573 570Q573 465 469 396L482 383Q533 332 533 252Q533 139 448 65T257 -10Q227 -10 203 -2T165 17T143 40T131 59T126 65L62 -188Q60 -194 42 -194H29ZM353 431Q392 431 427 419L432 422Q436 426 439 429T449 439T461 453T472 471T484 495T493 524T501 560Q503 569 503 593Q503 611 502 616Q487 667 426 667Q384 667 347 643T286 582T247 514T224 455Q219 439 186 308T152 168Q151 163 151 147Q151 99 173 68Q204 26 260 26Q302 26 349 51T425 137Q441 171 449 214T457 279Q457 337 422 372Q380 358 347 358H337Q258 358 258 389Q258 396 261 403Q275 431 353 431Z"></path></g><g data-mml-node="mn" transform="translate(599,-150) scale(0.707)"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path></g></g><g data-mml-node="mi" transform="translate(5051.1,0)"><path data-c="1D465" d="M52 289Q59 331 106 386T222 442Q257 442 286 424T329 379Q371 442 430 442Q467 442 494 420T522 361Q522 332 508 314T481 292T458 288Q439 288 427 299T415 328Q415 374 465 391Q454 404 425 404Q412 404 406 402Q368 386 350 336Q290 115 290 78Q290 50 306 38T341 26Q378 26 414 59T463 140Q466 150 469 151T485 153H489Q504 153 504 145Q504 144 502 134Q486 77 440 33T333 -11Q263 -11 227 52Q186 -10 133 -10H127Q78 -10 57 16T35 71Q35 103 54 123T99 143Q142 143 142 101Q142 81 130 66T107 46T94 41L91 40Q91 39 97 36T113 29T132 26Q168 26 194 71Q203 87 217 139T245 247T261 313Q266 340 266 352Q266 380 251 392T217 404Q177 404 142 372T93 290Q91 281 88 280T72 278H58Q52 284 52 289Z"></path></g></g></g></svg></mjx-container></p><ul>
<li>Aquí, <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.464ex;" xmlns="http://www.w3.org/2000/svg" width="1.109ex" height="2.296ex" role="img" focusable="false" viewBox="0 -810 490 1015"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="TeXAtom" data-mjx-texclass="ORD"><g data-mml-node="mover"><g data-mml-node="mi"><path data-c="1D466" d="M21 287Q21 301 36 335T84 406T158 442Q199 442 224 419T250 355Q248 336 247 334Q247 331 231 288T198 191T182 105Q182 62 196 45T238 27Q261 27 281 38T312 61T339 94Q339 95 344 114T358 173T377 247Q415 397 419 404Q432 431 462 431Q475 431 483 424T494 412T496 403Q496 390 447 193T391 -23Q363 -106 294 -155T156 -205Q111 -205 77 -183T43 -117Q43 -95 50 -80T69 -58T89 -48T106 -45Q150 -45 150 -87Q150 -107 138 -122T115 -142T102 -147L99 -148Q101 -153 118 -160T152 -167H160Q177 -167 186 -165Q219 -156 247 -127T290 -65T313 -9T321 21L315 17Q309 13 296 6T270 -6Q250 -11 231 -11Q185 -11 150 11T104 82Q103 89 103 113Q103 170 138 262T173 379Q173 380 173 381Q173 390 173 393T169 400T158 404H154Q131 404 112 385T82 344T65 302T57 280Q55 278 41 278H27Q21 284 21 287Z"></path></g><g data-mml-node="mo" transform="translate(300.6,16) translate(-250 0)"><path data-c="5E" d="M112 560L249 694L257 686Q387 562 387 560L361 531Q359 532 303 581L250 627L195 580Q182 569 169 557T148 538L140 532Q138 530 125 546L112 560Z"></path></g></g></g></g></g></svg></mjx-container> distingue la respuesta predicha de la respuesta real observada.</li>
<li>El término de error, <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="0.919ex" height="1ex" role="img" focusable="false" viewBox="0 -431 406 442"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D716" d="M227 -11Q149 -11 95 41T40 174Q40 262 87 322Q121 367 173 396T287 430Q289 431 329 431H367Q382 426 382 411Q382 385 341 385H325H312Q191 385 154 277L150 265H327Q340 256 340 246Q340 228 320 219H138V217Q128 187 128 143Q128 77 160 52T231 26Q258 26 284 36T326 57T343 68Q350 68 354 58T358 39Q358 36 357 35Q354 31 337 21T289 0T227 -11Z"></path></g></g></g></svg></mjx-container>, sigue presente conceptualmente pero no se incluye explícitamente en la fórmula predictiva.</li>
</ul>

<header>Introducción a Regresión Lineal</header>

<header>Introducción a Regresión Lineal</header>
<ul>
<li>La relación entre <code>x</code> e <code>y</code> —es decir, entre nuestras variables independiente y dependiente— es positiva, ya que a medida que <code>x</code> aumenta, también lo hace <code>y</code>.</li>
<li>La relación es negativa cuando los aumentos en la variable independiente corresponden a disminuciones en la variable dependiente (véase la <a href="#figure-4-2">figura 2</a>).</li>
<li>La regresión lineal puede ajustarse bien a los datos en ambos casos, siempre que la diferencia total entre los valores observados y predichos (el error residual) se mantenga al mínimo.</li>
<li>Sin embargo, incluso si el error residual es bajo, una pendiente cercana a cero sugeriría una relación débil o estadísticamente insignificante entre las variables.</li>
<li>La relación se <strong>considera neutral</strong> cuando los cambios en la variable independiente parecen tener poco o ningún efecto sobre la variable dependiente (véase la <a href="#figure-4-3">figura 3</a>)</li>
</ul>
<footer>Aprendizaje Estadístico</footer>
</section>

<h1 id="el-coeficiente-de-determinaci%C3%B3n-r-cuadrado">El Coeficiente de Determinación R-cuadrado (<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.048ex;" xmlns="http://www.w3.org/2000/svg" width="2.705ex" height="1.934ex" role="img" focusable="false" viewBox="0 -833.9 1195.6 854.9"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mi"><path data-c="1D445" d="M230 637Q203 637 198 638T193 649Q193 676 204 682Q206 683 378 683Q550 682 564 680Q620 672 658 652T712 606T733 563T739 529Q739 484 710 445T643 385T576 351T538 338L545 333Q612 295 612 223Q612 212 607 162T602 80V71Q602 53 603 43T614 25T640 16Q668 16 686 38T712 85Q717 99 720 102T735 105Q755 105 755 93Q755 75 731 36Q693 -21 641 -21H632Q571 -21 531 4T487 82Q487 109 502 166T517 239Q517 290 474 313Q459 320 449 321T378 323H309L277 193Q244 61 244 59Q244 55 245 54T252 50T269 48T302 46H333Q339 38 339 37T336 19Q332 6 326 0H311Q275 2 180 2Q146 2 117 2T71 2T50 1Q33 1 33 10Q33 12 36 24Q41 43 46 45Q50 46 61 46H67Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628Q287 635 230 637ZM630 554Q630 586 609 608T523 636Q521 636 500 636T462 637H440Q393 637 386 627Q385 624 352 494T319 361Q319 360 388 360Q466 361 492 367Q556 377 592 426Q608 449 619 486T630 554Z"></path></g><g data-mml-node="mn" transform="translate(792,363) scale(0.707)"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g></g></g></g></svg></mjx-container>)</h1>
<ul>
<li>La regresión lineal proporciona una medida para evaluar la fuerza de la relación entre la variable dependiente e independiente, conocida como R-cuadrado o coeficiente de determinación.</li>
<li><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.048ex;" xmlns="http://www.w3.org/2000/svg" width="2.705ex" height="1.934ex" role="img" focusable="false" viewBox="0 -833.9 1195.6 854.9"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mi"><path data-c="1D445" d="M230 637Q203 637 198 638T193 649Q193 676 204 682Q206 683 378 683Q550 682 564 680Q620 672 658 652T712 606T733 563T739 529Q739 484 710 445T643 385T576 351T538 338L545 333Q612 295 612 223Q612 212 607 162T602 80V71Q602 53 603 43T614 25T640 16Q668 16 686 38T712 85Q717 99 720 102T735 105Q755 105 755 93Q755 75 731 36Q693 -21 641 -21H632Q571 -21 531 4T487 82Q487 109 502 166T517 239Q517 290 474 313Q459 320 449 321T378 323H309L277 193Q244 61 244 59Q244 55 245 54T252 50T269 48T302 46H333Q339 38 339 37T336 19Q332 6 326 0H311Q275 2 180 2Q146 2 117 2T71 2T50 1Q33 1 33 10Q33 12 36 24Q41 43 46 45Q50 46 61 46H67Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628Q287 635 230 637ZM630 554Q630 586 609 608T523 636Q521 636 500 636T462 637H440Q393 637 386 627Q385 624 352 494T319 361Q319 360 388 360Q466 361 492 367Q556 377 592 426Q608 449 619 486T630 554Z"></path></g><g data-mml-node="mn" transform="translate(792,363) scale(0.707)"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g></g></g></g></svg></mjx-container> es un número entre <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.05ex;" xmlns="http://www.w3.org/2000/svg" width="1.131ex" height="1.557ex" role="img" focusable="false" viewBox="0 -666 500 688"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mn"><path data-c="30" d="M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 320Q39 494 96 585ZM321 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z"></path></g></g></g></svg></mjx-container> y <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.131ex" height="1.507ex" role="img" focusable="false" viewBox="0 -666 500 666"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mn"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path></g></g></g></svg></mjx-container> que especifica la proporción de varianza en la variable dependiente explicada por la regresión.</li>
<li>Un <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.048ex;" xmlns="http://www.w3.org/2000/svg" width="2.705ex" height="1.934ex" role="img" focusable="false" viewBox="0 -833.9 1195.6 854.9"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mi"><path data-c="1D445" d="M230 637Q203 637 198 638T193 649Q193 676 204 682Q206 683 378 683Q550 682 564 680Q620 672 658 652T712 606T733 563T739 529Q739 484 710 445T643 385T576 351T538 338L545 333Q612 295 612 223Q612 212 607 162T602 80V71Q602 53 603 43T614 25T640 16Q668 16 686 38T712 85Q717 99 720 102T735 105Q755 105 755 93Q755 75 731 36Q693 -21 641 -21H632Q571 -21 531 4T487 82Q487 109 502 166T517 239Q517 290 474 313Q459 320 449 321T378 323H309L277 193Q244 61 244 59Q244 55 245 54T252 50T269 48T302 46H333Q339 38 339 37T336 19Q332 6 326 0H311Q275 2 180 2Q146 2 117 2T71 2T50 1Q33 1 33 10Q33 12 36 24Q41 43 46 45Q50 46 61 46H67Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628Q287 635 230 637ZM630 554Q630 586 609 608T523 636Q521 636 500 636T462 637H440Q393 637 386 627Q385 624 352 494T319 361Q319 360 388 360Q466 361 492 367Q556 377 592 426Q608 449 619 486T630 554Z"></path></g><g data-mml-node="mn" transform="translate(792,363) scale(0.707)"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g></g></g></g></svg></mjx-container> alto indica que el modelo explica una gran parte de la varianza en la variable dependiente, mientras que un <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.048ex;" xmlns="http://www.w3.org/2000/svg" width="2.705ex" height="1.934ex" role="img" focusable="false" viewBox="0 -833.9 1195.6 854.9"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mi"><path data-c="1D445" d="M230 637Q203 637 198 638T193 649Q193 676 204 682Q206 683 378 683Q550 682 564 680Q620 672 658 652T712 606T733 563T739 529Q739 484 710 445T643 385T576 351T538 338L545 333Q612 295 612 223Q612 212 607 162T602 80V71Q602 53 603 43T614 25T640 16Q668 16 686 38T712 85Q717 99 720 102T735 105Q755 105 755 93Q755 75 731 36Q693 -21 641 -21H632Q571 -21 531 4T487 82Q487 109 502 166T517 239Q517 290 474 313Q459 320 449 321T378 323H309L277 193Q244 61 244 59Q244 55 245 54T252 50T269 48T302 46H333Q339 38 339 37T336 19Q332 6 326 0H311Q275 2 180 2Q146 2 117 2T71 2T50 1Q33 1 33 10Q33 12 36 24Q41 43 46 45Q50 46 61 46H67Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628Q287 635 230 637ZM630 554Q630 586 609 608T523 636Q521 636 500 636T462 637H440Q393 637 386 627Q385 624 352 494T319 361Q319 360 388 360Q466 361 492 367Q556 377 592 426Q608 449 619 486T630 554Z"></path></g><g data-mml-node="mn" transform="translate(792,363) scale(0.707)"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g></g></g></g></svg></mjx-container> bajo indica que el modelo no explica mucha varianza.</li>

<header>Introducción a Regresión Lineal</header>
<h1 id="limitaciones-cr%C3%ADticas-de-r-cuadrado">Limitaciones Críticas de R-cuadrado</h1>
<ul>
<li>Sin embargo, R-cuadrado tiene limitaciones significativas.</li>
<li>No indica si el modelo es sesgado o si las predicciones son precisas.</li>
<li>Un <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.048ex;" xmlns="http://www.w3.org/2000/svg" width="2.705ex" height="1.934ex" role="img" focusable="false" viewBox="0 -833.9 1195.6 854.9"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mi"><path data-c="1D445" d="M230 637Q203 637 198 638T193 649Q193 676 204 682Q206 683 378 683Q550 682 564 680Q620 672 658 652T712 606T733 563T739 529Q739 484 710 445T643 385T576 351T538 338L545 333Q612 295 612 223Q612 212 607 162T602 80V71Q602 53 603 43T614 25T640 16Q668 16 686 38T712 85Q717 99 720 102T735 105Q755 105 755 93Q755 75 731 36Q693 -21 641 -21H632Q571 -21 531 4T487 82Q487 109 502 166T517 239Q517 290 474 313Q459 320 449 321T378 323H309L277 193Q244 61 244 59Q244 55 245 54T252 50T269 48T302 46H333Q339 38 339 37T336 19Q332 6 326 0H311Q275 2 180 2Q146 2 117 2T71 2T50 1Q33 1 33 10Q33 12 36 24Q41 43 46 45Q50 46 61 46H67Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628Q287 635 230 637ZM630 554Q630 586 609 608T523 636Q521 636 500 636T462 637H440Q393 637 386 627Q385 624 352 494T319 361Q319 360 388 360Q466 361 492 367Q556 377 592 426Q608 449 619 486T630 554Z"></path></g><g data-mml-node="mn" transform="translate(792,363) scale(0.707)"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g></g></g></g></svg></mjx-container> alto no significa necesariamente que el modelo sea bueno, y un <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.048ex;" xmlns="http://www.w3.org/2000/svg" width="2.705ex" height="1.934ex" role="img" focusable="false" viewBox="0 -833.9 1195.6 854.9"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mi"><path data-c="1D445" d="M230 637Q203 637 198 638T193 649Q193 676 204 682Q206 683 378 683Q550 682 564 680Q620 672 658 652T712 606T733 563T739 529Q739 484 710 445T643 385T576 351T538 338L545 333Q612 295 612 223Q612 212 607 162T602 80V71Q602 53 603 43T614 25T640 16Q668 16 686 38T712 85Q717 99 720 102T735 105Q755 105 755 93Q755 75 731 36Q693 -21 641 -21H632Q571 -21 531 4T487 82Q487 109 502 166T517 239Q517 290 474 313Q459 320 449 321T378 323H309L277 193Q244 61 244 59Q244 55 245 54T252 50T269 48T302 46H333Q339 38 339 37T336 19Q332 6 326 0H311Q275 2 180 2Q146 2 117 2T71 2T50 1Q33 1 33 10Q33 12 36 24Q41 43 46 45Q50 46 61 46H67Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628Q287 635 230 637ZM630 554Q630 586 609 608T523 636Q521 636 500 636T462 637H440Q393 637 386 627Q385 624 352 494T319 361Q319 360 388 360Q466 361 492 367Q556 377 592 426Q608 449 619 486T630 554Z"></path></g><g data-mml-node="mn" transform="translate(792,363) scale(0.707)"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g></g></g></g></svg></mjx-container> bajo no significa necesariamente que sea malo.</li>
<li>Además, agregar más variables independientes a un modelo siempre aumentará o mantendrá igual el <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.048ex;" xmlns="http://www.w3.org/2000/svg" width="2.705ex" height="1.934ex" role="img" focusable="false" viewBox="0 -833.9 1195.6 854.9"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mi"><path data-c="1D445" d="M230 637Q203 637 198 638T193 649Q193 676 204 682Q206 683 378 683Q550 682 564 680Q620 672 658 652T712 606T733 563T739 529Q739 484 710 445T643 385T576 351T538 338L545 333Q612 295 612 223Q612 212 607 162T602 80V71Q602 53 603 43T614 25T640 16Q668 16 686 38T712 85Q717 99 720 102T735 105Q755 105 755 93Q755 75 731 36Q693 -21 641 -21H632Q571 -21 531 4T487 82Q487 109 502 166T517 239Q517 290 474 313Q459 320 449 321T378 323H309L277 193Q244 61 244 59Q244 55 245 54T252 50T269 48T302 46H333Q339 38 339 37T336 19Q332 6 326 0H311Q275 2 180 2Q146 2 117 2T71 2T50 1Q33 1 33 10Q33 12 36 24Q41 43 46 45Q50 46 61 46H67Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628Q287 635 230 637ZM630 554Q630 586 609 608T523 636Q521 636 500 636T462 637H440Q393 637 386 627Q385 624 352 494T319 361Q319 360 388 360Q466 361 492 367Q556 377 592 426Q608 449 619 486T630 554Z"></path></g><g data-mml-node="mn" transform="translate(792,363) scale(0.707)"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g></g></g></g></svg></mjx-container>, independientemente de si esas variables tienen una relación real con la variable dependiente; esto puede llevar al sobreajuste.</li>
</ul>
<footer>Aprendizaje Estadístico</footer>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-header="Introducción a Regresión Lineal" data-footer="Aprendizaje Estadístico" data-paginate="true" data-theme="lecture" data-marpit-pagination="19" data-marpit-pagination-total="89" style="--header:Introducción a Regresión Lineal;--footer:Aprendizaje Estadístico;--paginate:true;--theme:lecture;">
<header>Introducción a Regresión Lineal</header>
<h1 id="condiciones-para-el-mejor-ajuste-y-evaluaci%C3%B3n-global">Condiciones para el mejor ajuste y evaluación global</h1>
<ul>
<li>La regresión lineal proporciona los mejores resultados cuando se cumplen ciertas condiciones.</li>
<li>La bondad del ajuste debe evaluarse a partir de múltiples medidas.</li>
<li><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.048ex;" xmlns="http://www.w3.org/2000/svg" width="2.705ex" height="1.934ex" role="img" focusable="false" viewBox="0 -833.9 1195.6 854.9"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mi"><path data-c="1D445" d="M230 637Q203 637 198 638T193 649Q193 676 204 682Q206 683 378 683Q550 682 564 680Q620 672 658 652T712 606T733 563T739 529Q739 484 710 445T643 385T576 351T538 338L545 333Q612 295 612 223Q612 212 607 162T602 80V71Q602 53 603 43T614 25T640 16Q668 16 686 38T712 85Q717 99 720 102T735 105Q755 105 755 93Q755 75 731 36Q693 -21 641 -21H632Q571 -21 531 4T487 82Q487 109 502 166T517 239Q517 290 474 313Q459 320 449 321T378 323H309L277 193Q244 61 244 59Q244 55 245 54T252 50T269 48T302 46H333Q339 38 339 37T336 19Q332 6 326 0H311Q275 2 180 2Q146 2 117 2T71 2T50 1Q33 1 33 10Q33 12 36 24Q41 43 46 45Q50 46 61 46H67Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628Q287 635 230 637ZM630 554Q630 586 609 608T523 636Q521 636 500 636T462 637H440Q393 637 386 627Q385 624 352 494T319 361Q319 360 388 360Q466 361 492 367Q556 377 592 426Q608 449 619 486T630 554Z"></path></g><g data-mml-node="mn" transform="translate(792,363) scale(0.707)"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g></g></g></g></svg></mjx-container>, o el coeficiente de determinación, que equivale a un número entre <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.05ex;" xmlns="http://www.w3.org/2000/svg" width="1.131ex" height="1.557ex" role="img" focusable="false" viewBox="0 -666 500 688"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mn"><path data-c="30" d="M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 320Q39 494 96 585ZM321 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z"></path></g></g></g></svg></mjx-container> y <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.131ex" height="1.507ex" role="img" focusable="false" viewBox="0 -666 500 666"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mn"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path></g></g></g></svg></mjx-container> que especifica la proporción de varianza en la variable adquirida dependiente explicada por la regresión, podría ser la medida más significativa, pero difícilmente la única medida que importa.</li>
<li>El ajuste general se determina mediante el estadístico <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.695ex" height="1.538ex" role="img" focusable="false" viewBox="0 -680 749 680"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D439" d="M48 1Q31 1 31 11Q31 13 34 25Q38 41 42 43T65 46Q92 46 125 49Q139 52 144 61Q146 66 215 342T285 622Q285 629 281 629Q273 632 228 634H197Q191 640 191 642T193 659Q197 676 203 680H742Q749 676 749 669Q749 664 736 557T722 447Q720 440 702 440H690Q683 445 683 453Q683 454 686 477T689 530Q689 560 682 579T663 610T626 626T575 633T503 634H480Q398 633 393 631Q388 629 386 623Q385 622 352 492L320 363H375Q378 363 398 363T426 364T448 367T472 374T489 386Q502 398 511 419T524 457T529 475Q532 480 548 480H560Q567 475 567 470Q567 467 536 339T502 207Q500 200 482 200H470Q463 206 463 212Q463 215 468 234T473 274Q473 303 453 310T364 317H309L277 190Q245 66 245 60Q245 46 334 46H359Q365 40 365 39T363 19Q359 6 353 0H336Q295 2 185 2Q120 2 86 2T48 1Z"></path></g></g></g></svg></mjx-container>.</li>
<li>La significancia (e insignificancia) se fijan mediante los p-valores para los coeficientes individuales, así como el p-valor para el modelo.</li>
</ul>
<footer>Aprendizaje Estadístico</footer>

<header>Introducción a Regresión Lineal</header>
<h1 id="valores-at%C3%ADpicos">Valores Atípicos</h1>
<ul>
<li>Los valores atípicos son puntos de datos que difieren significativamente de otras observaciones en el mismo conjunto de datos.</li>
<li>Una forma de detectar valores atípicos, aunque no necesariamente la más precisa, es representar los datos en un diagrama de dispersión.</li>
<li>Volvamos a nuestro primer diagrama de dispersión en la <a href="#figure-4-1">figura 1</a>, específicamente al punto de datos ampliado donde las coordenadas <code>x</code> e <code>y</code> son iguales a <code>202</code> y <code>288</code>, respectivamente.</li>
</ul>

<header>Introducción a Regresión Lineal</header>
<h1 id="regresi%C3%B3n-lineal-simple">Regresión lineal simple</h1>
<p>Nuestro plan es hacer lo siguiente:</p>
<ol>
<li>Importe un conjunto de datos reales que contenga 20 registros y un par de variables numéricas.</li>
<li>Demuestra cómo realizar un ejercicio básico de exploración de datos.</li>
<li>Realice una regresión de una de esas variables con respecto a la otra, imprima los resultados y evalúe las medidas clave.</li>
<li>Proporcione instrucciones sobre cómo realizar una serie de pruebas y otras comprobaciones para determinar en qué medida se han cumplido, o no tan bien, los supuestos del modelo.</li>
</ol>
<footer>Aprendizaje Estadístico</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-header="Introducción a Regresión Lineal" data-footer="Aprendizaje Estadístico" data-paginate="true" data-theme="lecture" data-marpit-pagination="23" data-marpit-pagination-total="89" style="--header:Introducción a Regresión Lineal;--footer:Aprendizaje Estadístico;--paginate:true;--theme:lecture;">
<header>Introducción a Regresión Lineal</header>
<h1 id="importaci%C3%B3n-y-exploraci%C3%B3n-de-los-datos">Importación y exploración de los datos</h1>
<p>El Maratón de las Arenas (<a href="https://marathondessables.com/en/" target="_blank">Marathon des Sables</a>) es un ultramaratón que se celebra anualmente desde 1986 en el desierto del Sahara. La carrera se divide en seis etapas a lo largo de siete días; la distancia total es de 250 kilómetros, o aproximadamente 160 millas, lo que equivale a seis maratones. Las temperaturas diurnas pueden alcanzar los 50 °C, o aproximadamente 130 °F. Los corredores son responsables de llevar sus propios suministros, como comida, agua, calzado y calcetines de repuesto, etc.</p>
<p>El contenido de mds se lee en un marco de datos llamado <code>mds</code>. Pero para evitar que <code>pd.read_csv()</code> genere un error, primero debemos importar la biblioteca <code>pandas</code>, una potente biblioteca de Python para el análisis y la manipulación de datos:</p>
<footer>Aprendizaje Estadístico</footer>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-header="Introducción a Regresión Lineal" data-footer="Aprendizaje Estadístico" data-paginate="true" data-theme="lecture" data-marpit-pagination="28" data-marpit-pagination-total="89" style="--header:Introducción a Regresión Lineal;--footer:Aprendizaje Estadístico;--paginate:true;--theme:lecture;">
<header>Introducción a Regresión Lineal</header>
<h2 id="c%C3%A1lculo-de-estad%C3%ADsticas-b%C3%A1sicas">Cálculo de estadísticas básicas</h2>
<p>El método <code>describe()</code> de pandas analiza los datos y devuelve una serie de estadísticas descriptivas, siempre que los datos sean numéricos, incluyendo el recuento de registros (<code>count</code>), la media (<code>mean</code>), la desviación estándar (<code>std</code>), los valores mínimo (<code>min</code>) y máximo (<code>max</code>), y tres cuartiles (<code>25%</code>, <code>50%</code> y <code>75%</code>). Cuando los datos son categóricos, es decir, cuando representan categorías o etiquetas y, por lo tanto, no contienen un valor numérico natural, el método <code>describe()</code> devuelve estadísticas de resumen, como el número de grupos únicos y el recuento de registros para cada uno.</p>
<footer>Aprendizaje Estadístico</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-header="Introducción a Regresión Lineal" data-footer="Aprendizaje Estadístico" data-paginate="true" data-theme="lecture" data-marpit-pagination="29" data-marpit-pagination-total="89" style="--header:Introducción a Regresión Lineal;--footer:Aprendizaje Estadístico;--paginate:true;--theme:lecture;">
<header>Introducción a Regresión Lineal</header>

</code></pre>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-header="Introducción a Regresión Lineal" data-footer="Aprendizaje Estadístico" data-paginate="true" data-theme="lecture" data-marpit-pagination="30" data-marpit-pagination-total="89" style="--header:Introducción a Regresión Lineal;--footer:Aprendizaje Estadístico;--paginate:true;--theme:lecture;">
<header>Introducción a Regresión Lineal</header>
<h2 id="prueba-de-normalidad">Prueba de normalidad</h2>
<p>La regresión lineal presupone que los residuos —es decir, las diferencias entre los valores observados y predichos— siguen una distribución normal. Demostraremos cómo comprobar esta suposición tras ajustar nuestro modelo, pero por ahora, queremos saber si las variables en sí mismas siguen una distribución normal. Esto se debe a que si la única variable predictora en una regresión simple sigue una distribución normal, es probable que los residuos también la sigan.</p>
<footer>Aprendizaje Estadístico</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-header="Introducción a Regresión Lineal" data-footer="Aprendizaje Estadístico" data-paginate="true" data-theme="lecture" data-marpit-pagination="31" data-marpit-pagination-total="89" style="--header:Introducción a Regresión Lineal;--footer:Aprendizaje Estadístico;--paginate:true;--theme:lecture;">
<header>Introducción a Regresión Lineal</header>
<h2 id="pruebas-estad%C3%ADsticas-y-el-umbral-del-5-para-la-significancia">Pruebas estadísticas y el umbral del 5% para la significancia</h2>
<ul>
<li>Las pruebas estadísticas son herramientas que se utilizan para determinar si los resultados observados en los datos se deben probablemente a un efecto real o simplemente al azar.</li>
<li>Estas pruebas arrojan un valor <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.439ex;" xmlns="http://www.w3.org/2000/svg" width="1.138ex" height="1.439ex" role="img" focusable="false" viewBox="0 -442 503 636"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D45D" d="M23 287Q24 290 25 295T30 317T40 348T55 381T75 411T101 433T134 442Q209 442 230 378L240 387Q302 442 358 442Q423 442 460 395T497 281Q497 173 421 82T249 -10Q227 -10 210 -4Q199 1 187 11T168 28L161 36Q160 35 139 -51T118 -138Q118 -144 126 -145T163 -148H188Q194 -155 194 -157T191 -175Q188 -187 185 -190T172 -194Q170 -194 161 -194T127 -193T65 -192Q-5 -192 -24 -194H-32Q-39 -187 -39 -183Q-37 -156 -26 -148H-6Q28 -147 33 -136Q36 -130 94 103T155 350Q156 355 156 364Q156 405 131 405Q109 405 94 377T71 316T59 280Q57 278 43 278H29Q23 284 23 287ZM178 102Q200 26 252 26Q282 26 310 49T356 107Q374 141 392 215T411 325V331Q411 405 350 405Q339 405 328 402T306 393T286 380T269 365T254 350T243 336T235 326L232 322Q232 321 229 308T218 264T204 212Q178 106 178 102Z"></path></g></g></g></svg></mjx-container>, que cuantifica la probabilidad de que los resultados observados pudieran haber ocurrido bajo la hipótesis nula (suponiendo que no existe un efecto real).</li>
<li>El nivel de significancia del 5 % (<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.439ex;" xmlns="http://www.w3.org/2000/svg" width="8.178ex" height="1.946ex" role="img" focusable="false" viewBox="0 -666 3614.6 860"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D45D" d="M23 287Q24 290 25 295T30 317T40 348T55 381T75 411T101 433T134 442Q209 442 230 378L240 387Q302 442 358 442Q423 442 460 395T497 281Q497 173 421 82T249 -10Q227 -10 210 -4Q199 1 187 11T168 28L161 36Q160 35 139 -51T118 -138Q118 -144 126 -145T163 -148H188Q194 -155 194 -157T191 -175Q188 -187 185 -190T172 -194Q170 -194 161 -194T127 -193T65 -192Q-5 -192 -24 -194H-32Q-39 -187 -39 -183Q-37 -156 -26 -148H-6Q28 -147 33 -136Q36 -130 94 103T155 350Q156 355 156 364Q156 405 131 405Q109 405 94 377T71 316T59 280Q57 278 43 278H29Q23 284 23 287ZM178 102Q200 26 252 26Q282 26 310 49T356 107Q374 141 392 215T411 325V331Q411 405 350 405Q339 405 328 402T306 393T286 380T269 365T254 350T243 336T235 326L232 322Q232 321 229 308T218 264T204 212Q178 106 178 102Z"></path></g><g data-mml-node="mo" transform="translate(780.8,0)"><path data-c="3C" d="M694 -11T694 -19T688 -33T678 -40Q671 -40 524 29T234 166L90 235Q83 240 83 250Q83 261 91 266Q664 540 678 540Q681 540 687 534T694 519T687 505Q686 504 417 376L151 250L417 124Q686 -4 687 -5Q694 -11 694 -19Z"></path></g><g data-mml-node="mn" transform="translate(1836.6,0)"><path data-c="30" d="M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 320Q39 494 96 585ZM321 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z"></path><path data-c="2E" d="M78 60Q78 84 95 102T138 120Q162 120 180 104T199 61Q199 36 182 18T139 0T96 17T78 60Z" transform="translate(500,0)"></path><path data-c="30" d="M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 320Q39 494 96 585ZM321 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z" transform="translate(778,0)"></path><path data-c="35" d="M164 157Q164 133 148 117T109 101H102Q148 22 224 22Q294 22 326 82Q345 115 345 210Q345 313 318 349Q292 382 260 382H254Q176 382 136 314Q132 307 129 306T114 304Q97 304 95 310Q93 314 93 485V614Q93 664 98 664Q100 666 102 666Q103 666 123 658T178 642T253 634Q324 634 389 662Q397 666 402 666Q410 666 410 648V635Q328 538 205 538Q174 538 149 544L139 546V374Q158 388 169 396T205 412T256 420Q337 420 393 355T449 201Q449 109 385 44T229 -22Q148 -22 99 32T50 154Q50 178 61 192T84 210T107 214Q132 214 148 197T164 157Z" transform="translate(1278,0)"></path></g></g></g></svg></mjx-container>) es un umbral ampliamente aceptado, donde los resultados se consideran estadísticamente significativos si existe menos de un 5 % de probabilidad de que ocurran bajo la hipótesis nula; en ese caso, se rechaza la hipótesis nula.</li>
</ul>
<footer>Aprendizaje Estadístico</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-header="Introducción a Regresión Lineal" data-footer="Aprendizaje Estadístico" data-paginate="true" data-theme="lecture" data-marpit-pagination="32" data-marpit-pagination-total="89" style="--header:Introducción a Regresión Lineal;--footer:Aprendizaje Estadístico;--paginate:true;--theme:lecture;">
<header>Introducción a Regresión Lineal</header>
<p>Para ejecutar un par de pruebas de Shapiro-Wilk, una para cada variable <code>mds</code>, importamos el módulo <code>stats</code> de la biblioteca <code>scipy</code>, que contiene varias funciones estadísticas para la computación científica, y luego pasamos <code>stage1</code> y <code>stage2</code> al método <code>shapiro()</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-built_in">print</span>(stats.shapiro(mds.stage1))
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>ShapiroResult(statistic=0.9446673217389622, pvalue=0.29328758849732417)
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-built_in">print</span>(stats.shapiro(mds.stage2))
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>ShapiroResult(statistic=0.9290259439587454, pvalue=0.1478907551379664)
</code></pre>
<footer>Aprendizaje Estadístico</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-header="Introducción a Regresión Lineal" data-footer="Aprendizaje Estadístico" data-paginate="true" data-theme="lecture" data-marpit-pagination="33" data-marpit-pagination-total="89" style="--header:Introducción a Regresión Lineal;--footer:Aprendizaje Estadístico;--paginate:true;--theme:lecture;">
<header>Introducción a Regresión Lineal</header>
<h1 id="detecci%C3%B3n-de-valores-at%C3%ADpicos">Detección de valores atípicos</h1>
<ul>
<li>Existen muchas maneras de detectar valores atípicos en los datos. Sin embargo, las pruebas estadísticas en este ámbito presentan serias limitaciones.</li>
<li>Los diagramas de caja muestran los valores atípicos, si los hay, como puntos de datos individuales por encima y por debajo de los bigotes, pero en realidad no nos indican qué registros contienen dichos valores atípicos.</li>
<li>Primero, definamos un valor atípico como cualquier dato que se encuentre más allá de tres desviaciones estándar de la media, ya sea hacia arriba o hacia abajo, lo cual es bastante común.</li>
</ul>
<footer>Aprendizaje Estadístico</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-header="Introducción a Regresión Lineal" data-footer="Aprendizaje Estadístico" data-paginate="true" data-theme="lecture" data-marpit-pagination="34" data-marpit-pagination-total="89" style="--header:Introducción a Regresión Lineal;--footer:Aprendizaje Estadístico;--paginate:true;--theme:lecture;">
<header>Introducción a Regresión Lineal</header>
<ul>
<li>Conocemos las medias y desviaciones estándar de <code>stage1</code> y <code>stage2</code>; las obtuvimos, junto con otras medidas, al llamar al método <code>describe()</code>.</li>
<li>Un valor atípico de <code>stage 1</code> es cualquier dato que se encuentre más allá de la media de <code>stage 1</code> más o menos el producto de 3 y la desviación estándar de <code>stage 1</code>.</li>
<li>Podemos definirlos, respectivamente, como <code>upper_threshold</code> y <code>lower_threshold</code>, donde <code>194.55</code> es la media y <code>29.62</code> es la desviación estándar:</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">upper_threshold = <span class="hljs-number">194.55</span> + (<span class="hljs-number">3</span> * <span class="hljs-number">29.62</span>)
lower_threshold = <span class="hljs-number">194.55</span> - (<span class="hljs-number">3</span> * <span class="hljs-number">29.62</span>)
</code></pre>
<footer>Aprendizaje Estadístico</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-header="Introducción a Regresión Lineal" data-footer="Aprendizaje Estadístico" data-paginate="true" data-theme="lecture" data-marpit-pagination="35" data-marpit-pagination-total="89" style="--header:Introducción a Regresión Lineal;--footer:Aprendizaje Estadístico;--paginate:true;--theme:lecture;">
<header>Introducción a Regresión Lineal</header>
<p>El siguiente fragmento de código selecciona del marco de datos <code>mds</code> aquellos registros que superan el umbral <code>upper_threshold</code> o el umbral <code>lower_threshold</code>; el operador <code>|</code> significa OR, por lo que solo debe cumplirse una de las condiciones. Python devuelve un marco de datos reducido, <code>exceed_threshold</code>, o un marco de datos vacío si <code>mds</code> no contiene registros que cumplan ninguna de las condiciones. Nótese el uso de la barra invertida (<code>\</code>), que se utiliza como carácter de continuación de línea en el código Python:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">exceed_threshold = mds[(mds[<span class="hljs-string">&#x27;stage1&#x27;</span>] &gt; upper_threshold) | \
                       (mds[<span class="hljs-string">&#x27;stage1&#x27;</span>] &lt; lower_threshold)]
<span class="hljs-built_in">print</span>(exceed_threshold)
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Empty DataFrame
Columns: [stage1, stage2]
Index: []
</code></pre>
<footer>Aprendizaje Estadístico</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-header="Introducción a Regresión Lineal" data-footer="Aprendizaje Estadístico" data-paginate="true" data-theme="lecture" data-marpit-pagination="36" data-marpit-pagination-total="89" style="--header:Introducción a Regresión Lineal;--footer:Aprendizaje Estadístico;--paginate:true;--theme:lecture;">
<header>Introducción a Regresión Lineal</header>
<p>La variable <code>stage1</code> no contiene ningún valor atípico, al menos según nuestros criterios. Obtenemos los mismos resultados para <code>stage2</code>, de hecho, después de cambiar nuestros parámetros y volver a ejecutar el mismo fragmento de código:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">upper_threshold = <span class="hljs-number">251.45</span> + (<span class="hljs-number">3</span> * <span class="hljs-number">51.11</span>)
lower_threshold = <span class="hljs-number">251.45</span> - (<span class="hljs-number">3</span> * <span class="hljs-number">51.11</span>)
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">exceed_threshold = mds[(mds[<span class="hljs-string">&#x27;stage2&#x27;</span>] &gt; upper_threshold) | \
                       (mds[<span class="hljs-string">&#x27;stage2&#x27;</span>] &lt; lower_threshold)]
<span class="hljs-built_in">print</span>(exceed_threshold)
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Empty DataFrame
Columns: [stage1, stage2]
Index: []
</code></pre>
<footer>Aprendizaje Estadístico</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-header="Introducción a Regresión Lineal" data-footer="Aprendizaje Estadístico" data-paginate="true" data-theme="lecture" data-marpit-pagination="37" data-marpit-pagination-total="89" style="--header:Introducción a Regresión Lineal;--footer:Aprendizaje Estadístico;--paginate:true;--theme:lecture;">
<header>Introducción a Regresión Lineal</header>
<h1 id="ajuste-del-modelo">Ajuste del modelo</h1>
<p>Realizaremos una regresión lineal simple mediante el método <code>OLS()</code> de la biblioteca <code>statsmodels</code>. <code>stage2</code> será nuestra variable dependiente y <code>stage1</code> nuestra variable independiente. Por lo tanto, realizaremos una regresión de <code>stage2</code> con respecto a <code>stage1</code> para estimar los tiempos de división de la Etapa 2 a partir de los tiempos de división de la Etapa 1.</p>
<footer>Aprendizaje Estadístico</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-header="Introducción a Regresión Lineal" data-paginate="true" data-theme="lecture" data-marpit-pagination="38" data-marpit-pagination-total="89" style="--header:Introducción a Regresión Lineal;--paginate:true;--theme:lecture;">
<header>Introducción a Regresión Lineal</header>

<p>Lo primero que debemos hacer es importar la biblioteca <code>statsmodels</code> y definir nuestra variable de respuesta, <code>y</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> statsmodels.api <span class="hljs-keyword">as</span> sm
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">y = mds[<span class="hljs-string">&#x27;stage2&#x27;</span>]
</code></pre>
<p>A continuación, definimos nuestra variable predictora, <code>x</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">x = mds[<span class="hljs-string">&#x27;stage1&#x27;</span>]
</code></pre>
<p>Si en cambio estuviéramos ajustando una regresión lineal múltiple con un total de dos predictores, <code>stage1</code> y, digamos, <code>second_variable</code>, definiríamos <code>x</code> de esta manera (nótese el conjunto adicional de corchetes):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">x = mds[[<span class="hljs-string">&#x27;stage1&#x27;</span>, <span class="hljs-string">&#x27;second_variable&#x27;</span>]]
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-header="Introducción a Regresión Lineal" data-paginate="true" data-theme="lecture" data-marpit-pagination="39" data-marpit-pagination-total="89" style="--header:Introducción a Regresión Lineal;--paginate:true;--theme:lecture;">
<header>Introducción a Regresión Lineal</header>

<p>A continuación, añadimos una constante a <code>x</code>, conocida como la <em>intercepto</em>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">x = sm.add_constant(x)
</code></pre>
<p>Ahora podemos ajustar nuestro modelo, <code>lm</code>, e imprimir los resultados:</p>
<ul>
<li><code>sm.OLS(y,</code> <code>x)</code> inicializa la regresión usando <code>x</code> <code>(etapa1)</code> como única variable independiente y <code>y</code> (<code>etapa2</code>) como variable dependiente.</li>
<li>Como previamente <em>añadimos</em> la constante a <code>x</code>, solo necesitamos pasar <code>y</code> y <code>x</code>; la constante ya está contemplada.</li>
<li>La función <code>fit()</code> ajusta el modelo inicializado al marco de datos <code>mds</code> y estima los coeficientes de la regresión lineal que minimiza la suma de las diferencias cuadráticas entre los valores observados y predichos de <code>y</code>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-header="Introducción a Regresión Lineal" data-footer="Aprendizaje Estadístico" data-paginate="true" data-theme="lecture" data-marpit-pagination="40" data-marpit-pagination-total="89" style="--header:Introducción a Regresión Lineal;--footer:Aprendizaje Estadístico;--paginate:true;--theme:lecture;">
<header>Introducción a Regresión Lineal</header>
<ul>
<li>Estos resultados y otras estadísticas relevantes se almacenan en un objeto llamado <code>lm</code>.</li>
<li><code>print()</code> devuelve el contenido de <code>lm</code> en forma de lo que se denomina una <em>tabla de regresión</em>.</li>
</ul>
<p>Bastan dos líneas de código Python para ajustar la regresión e imprimir el resultado del modelo:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">lm = sm.OLS(y, x).fit()
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-built_in">print</span>(lm.summary())
</code></pre>
<footer>Aprendizaje Estadístico</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-header="Introducción a Regresión Lineal" data-footer="Aprendizaje Estadístico" data-paginate="true" data-theme="lecture" data-marpit-pagination="41" data-marpit-pagination-total="89" style="--header:Introducción a Regresión Lineal;--footer:Aprendizaje Estadístico;--paginate:true;--theme:lecture;">
<header>Introducción a Regresión Lineal</header>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>OLS Regression Results

<header>Introducción a Regresión Lineal</header>
<h1 id="interpretaci%C3%B3n-y-evaluaci%C3%B3n-de-los-resultados">Interpretación y evaluación de los resultados</h1>
<ul>
<li>La biblioteca <code>statsmodels</code> devuelve los resultados de la regresión en formato tabular, no como un diagrama de dispersión con una línea de regresión ajustada, ya que prioriza el análisis numérico y los resúmenes estadísticos sobre las representaciones gráficas.</li>
<li>Si bien los diagramas de dispersión pueden ser útiles para visualizar regresiones simples con un solo predictor, no son prácticos para modelos con múltiples predictores, que requieren gráficos multidimensionales difíciles de mostrar.</li>
<li>Para empezar, deberíamos estar más interesados en medidas de poder predictivo, significancia estadística, etc., que solo obtenemos de una tabla de regresión.</li>
</ul>

<header>Introducción a Regresión Lineal</header>
<p>Ilustremos estos mismos resultados con un diagrama de dispersión de Matplotlib que contenga los valores observados para <code>stage1</code> y <code>stage2</code> superpuestos con la línea de regresión ajustada. Aquí está el fragmento de código:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">plt.scatter(mds[<span class="hljs-string">&#x27;stage1&#x27;</span>], mds[<span class="hljs-string">&#x27;stage2&#x27;</span>])
plt.xlim(<span class="hljs-number">150</span>, <span class="hljs-number">260</span>)
plt.ylim(<span class="hljs-number">150</span>, <span class="hljs-number">350</span>)
yhat = -<span class="hljs-number">3.078</span> + (<span class="hljs-number">1.3083</span> * x)
plt.plot(x, yhat, linewidth = <span class="hljs-number">2</span>,
         color = <span class="hljs-string">&#x27;red&#x27;</span>)
plt.title(<span class="hljs-string">&#x27;2021 Marathon Des Sables - Top 20 Male Finishers\n&#x27;</span>
          <span class="hljs-string">&#x27;y = -3.078 + (1.3083 * x)\n&#x27;</span>
          <span class="hljs-string">&#x27;R-squared = 0.575&#x27;</span>,
          fontweight = <span class="hljs-string">&#x27;bold&#x27;</span>)
plt.xlabel(<span class="hljs-string">&#x27;Stage 1 Running Time (min)&#x27;</span>)
plt.ylabel(<span class="hljs-string">&#x27;Stage 2 Running Time (min)&#x27;</span>)
plt.grid()
plt.show()
</code></pre>
<footer>Aprendizaje Estadístico</footer>
</section>

</ul>

<header>Introducción a Regresión Lineal</header>
<ul>
<li>La pendiente representa <strong>la tasa de cambio de la variable dependiente</strong> ante un cambio de una unidad en la variable independiente; por lo tanto, cuantifica la fuerza y la dirección de la relación lineal entre las variables.</li>

<header>Introducción a Regresión Lineal</header>
<ul>
<li>Las estimaciones de los coeficientes representan el resultado más significativo del análisis de regresión.</li>
<li>Nos ayudan a comprender y cuantificar la asociación entre las variables independientes y dependientes.</li>
<li>Al realizar una regresión de <code>stage2</code> frente a <code>stage1</code>, hemos descubierto que por cada aumento de una unidad (o un minuto) en <code>stage1</code>, deberíamos esperar que <code>stage2</code> aumente en 1.3083.</li>
<li>Las demás medidas que vale la pena evaluar tienen mucho menos que ver con cuantificar la asociación entre variables y más con evaluar la bondad de ajuste.</li>
</ul>
<footer>Aprendizaje Estadístico</footer>
</section>

<h1 id="cuadrado"><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.048ex;" xmlns="http://www.w3.org/2000/svg" width="1.717ex" height="1.593ex" role="img" focusable="false" viewBox="0 -683 759 704"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D445" d="M230 637Q203 637 198 638T193 649Q193 676 204 682Q206 683 378 683Q550 682 564 680Q620 672 658 652T712 606T733 563T739 529Q739 484 710 445T643 385T576 351T538 338L545 333Q612 295 612 223Q612 212 607 162T602 80V71Q602 53 603 43T614 25T640 16Q668 16 686 38T712 85Q717 99 720 102T735 105Q755 105 755 93Q755 75 731 36Q693 -21 641 -21H632Q571 -21 531 4T487 82Q487 109 502 166T517 239Q517 290 474 313Q459 320 449 321T378 323H309L277 193Q244 61 244 59Q244 55 245 54T252 50T269 48T302 46H333Q339 38 339 37T336 19Q332 6 326 0H311Q275 2 180 2Q146 2 117 2T71 2T50 1Q33 1 33 10Q33 12 36 24Q41 43 46 45Q50 46 61 46H67Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628Q287 635 230 637ZM630 554Q630 586 609 608T523 636Q521 636 500 636T462 637H440Q393 637 386 627Q385 624 352 494T319 361Q319 360 388 360Q466 361 492 367Q556 377 592 426Q608 449 619 486T630 554Z"></path></g></g></g></svg></mjx-container>-cuadrado</h1>
<ul>
<li>En la salida del modelo, <code>R cuadrado</code> es igual a <code>0.575</code>.</li>
<li>El <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.048ex;" xmlns="http://www.w3.org/2000/svg" width="1.717ex" height="1.593ex" role="img" focusable="false" viewBox="0 -683 759 704"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D445" d="M230 637Q203 637 198 638T193 649Q193 676 204 682Q206 683 378 683Q550 682 564 680Q620 672 658 652T712 606T733 563T739 529Q739 484 710 445T643 385T576 351T538 338L545 333Q612 295 612 223Q612 212 607 162T602 80V71Q602 53 603 43T614 25T640 16Q668 16 686 38T712 85Q717 99 720 102T735 105Q755 105 755 93Q755 75 731 36Q693 -21 641 -21H632Q571 -21 531 4T487 82Q487 109 502 166T517 239Q517 290 474 313Q459 320 449 321T378 323H309L277 193Q244 61 244 59Q244 55 245 54T252 50T269 48T302 46H333Q339 38 339 37T336 19Q332 6 326 0H311Q275 2 180 2Q146 2 117 2T71 2T50 1Q33 1 33 10Q33 12 36 24Q41 43 46 45Q50 46 61 46H67Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628Q287 635 230 637ZM630 554Q630 586 609 608T523 636Q521 636 500 636T462 637H440Q393 637 386 627Q385 624 352 494T319 361Q319 360 388 360Q466 361 492 367Q556 377 592 426Q608 449 619 486T630 554Z"></path></g></g></g></svg></mjx-container>-cuadrado (<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.048ex;" xmlns="http://www.w3.org/2000/svg" width="2.705ex" height="1.934ex" role="img" focusable="false" viewBox="0 -833.9 1195.6 854.9"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mi"><path data-c="1D445" d="M230 637Q203 637 198 638T193 649Q193 676 204 682Q206 683 378 683Q550 682 564 680Q620 672 658 652T712 606T733 563T739 529Q739 484 710 445T643 385T576 351T538 338L545 333Q612 295 612 223Q612 212 607 162T602 80V71Q602 53 603 43T614 25T640 16Q668 16 686 38T712 85Q717 99 720 102T735 105Q755 105 755 93Q755 75 731 36Q693 -21 641 -21H632Q571 -21 531 4T487 82Q487 109 502 166T517 239Q517 290 474 313Q459 320 449 321T378 323H309L277 193Q244 61 244 59Q244 55 245 54T252 50T269 48T302 46H333Q339 38 339 37T336 19Q332 6 326 0H311Q275 2 180 2Q146 2 117 2T71 2T50 1Q33 1 33 10Q33 12 36 24Q41 43 46 45Q50 46 61 46H67Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628Q287 635 230 637ZM630 554Q630 586 609 608T523 636Q521 636 500 636T462 637H440Q393 637 386 627Q385 624 352 494T319 361Q319 360 388 360Q466 361 492 367Q556 377 592 426Q608 449 619 486T630 554Z"></path></g><g data-mml-node="mn" transform="translate(792,363) scale(0.707)"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g></g></g></g></svg></mjx-container>), el coeficiente de determinación, es igual al porcentaje de la varianza en la variable de respuesta que puede explicarse por la variable independiente.</li>
<li>Por lo tanto, el 57.5% de la varianza en los tiempos parciales de la Etapa 2 de los 20 primeros clasificados masculinos en el Maratón des Sables 2021 puede explicarse por sus tiempos parciales de la Etapa 1.</li>
</ul>

<header>Introducción a Regresión Lineal</header>
<ul>
<li>El <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.048ex;" xmlns="http://www.w3.org/2000/svg" width="2.705ex" height="1.934ex" role="img" focusable="false" viewBox="0 -833.9 1195.6 854.9"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mi"><path data-c="1D445" d="M230 637Q203 637 198 638T193 649Q193 676 204 682Q206 683 378 683Q550 682 564 680Q620 672 658 652T712 606T733 563T739 529Q739 484 710 445T643 385T576 351T538 338L545 333Q612 295 612 223Q612 212 607 162T602 80V71Q602 53 603 43T614 25T640 16Q668 16 686 38T712 85Q717 99 720 102T735 105Q755 105 755 93Q755 75 731 36Q693 -21 641 -21H632Q571 -21 531 4T487 82Q487 109 502 166T517 239Q517 290 474 313Q459 320 449 321T378 323H309L277 193Q244 61 244 59Q244 55 245 54T252 50T269 48T302 46H333Q339 38 339 37T336 19Q332 6 326 0H311Q275 2 180 2Q146 2 117 2T71 2T50 1Q33 1 33 10Q33 12 36 24Q41 43 46 45Q50 46 61 46H67Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628Q287 635 230 637ZM630 554Q630 586 609 608T523 636Q521 636 500 636T462 637H440Q393 637 386 627Q385 624 352 494T319 361Q319 360 388 360Q466 361 492 367Q556 377 592 426Q608 449 619 486T630 554Z"></path></g><g data-mml-node="mn" transform="translate(792,363) scale(0.707)"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g></g></g></g></svg></mjx-container> es una medida de ajuste fundamental y significativa para el análisis de regresión, ya sea fija a un solo modelo o incluso para comparar diferentes modelos ajust <li>Debido a que es un número al cuadrado y representa el porcentaje de la varianza en la variable de respuesta causada por un predictor en una regresión simple o por dos o más predictores en una regresión múltiple, el <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.452ex;" xmlns="http://www.w3.org/2000/svg" width="3.075ex" height="2.149ex" role="img" focusable="false" viewBox="0 -750 1359 950"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D445" d="M230 637Q203 637 198 638T193 649Q193 676 204 682Q206 683 378 683Q550 682 564 680Q620 672 658 652T712 606T733 563T739 529Q739 484 710 445T643 385T576 351T538 338L545 333Q612 295 612 223Q612 212 607 162T602 80V71Q602 53 603 43T614 25T640 16Q668 16 686 38T712 85Q717 99 720 102T735 105Q755 105 755 93Q755 75 731 36Q693 -21 641 -21H632Q571 -21 531 4T487 82Q487 109 502 166T517 239Q517 290 474 313Q459 320 449 321T378 323H309L277 193Q244 61 244 59Q244 55 245 54T252 50T269 48T302 46H333Q339 38 339 37T336 19Q332 6 326 0H311Q275 2 180 2Q146 2 117 2T71 2T50 1Q33 1 33 10Q33 12 36 24Q41 43 46 45Q50 46 61 46H67Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628Q287 635 230 637ZM630 554Q630 586 609 608T523 636Q521 636 500 636T462 637H440Q393 637 386 627Q385 624 352 494T319 361Q319 360 388 360Q466 361 492 367Q556 377 592 426Q608 449 619 486T630 554Z"></path></g><g data-mml-node="TeXAtom" data-mjx-texclass="ORD" transform="translate(759,0)"><g data-mml-node="mo"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">²</text></g></g></g></g></svg></mjx-container> siempre será igual a un número entre 0 y 1.</li>
<li>Para que el <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.048ex;" xmlns="http://www.w3.org/2000/svg" width="2.705ex" height="1.934ex" role="img" focusable="false" viewBox="0 -833.9 1195.6 854.9"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mi"><path data-c="1D445" d="M230 637Q203 637 198 638T193 649Q193 676 204 682Q206 683 378 683Q550 682 564 680Q620 672 658 652T712 606T733 563T739 529Q739 484 710 445T643 385T576 351T538 338L545 333Q612 295 612 223Q612 212 607 162T602 80V71Q602 53 603 43T614 25T640 16Q668 16 686 38T712 85Q717 99 720 102T735 105Q755 105 755 93Q755 75 731 36Q693 -21 641 -21H632Q571 -21 531 4T487 82Q487 109 502 166T517 239Q517 290 474 313Q459 320 449 321T378 323H309L277 193Q244 61 244 59Q244 55 245 54T252 50T269 48T302 46H333Q339 38 339 37T336 19Q332 6 326 0H311Q275 2 180 2Q146 2 117 2T71 2T50 1Q33 1 33 10Q33 12 36 24Q41 43 46 45Q50 46 61 46H67Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628Q287 635 230 637ZM630 554Q630 586 609 608T523 636Q521 636 500 636T462 637H440Q393 637 386 627Q385 624 352 494T319 361Q319 360 388 360Q466 361 492 367Q556 377 592 426Q608 449 619 486T630 554Z"></path></g><g data-mml-node="mn" transform="translate(792,363) scale(0.707)"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g></g></g></g></svg></mjx-container> sea igual a 1, cada punto de datos debe estar sobre la línea de regresión, lo cual es raro.</li>
</ul>

<p>La forma más directa de obtener <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.048ex;" xmlns="http://www.w3.org/2000/svg" width="2.705ex" height="1.934ex" role="img" focusable="false" viewBox="0 -833.9 1195.6 854.9"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mi"><path data-c="1D445" d="M230 637Q203 637 198 638T193 649Q193 676 204 682Q206 683 378 683Q550 682 564 680Q620 672 658 652T712 606T733 563T739 529Q739 484 710 445T643 385T576 351T538 338L545 333Q612 295 612 223Q612 212 607 162T602 80V71Q602 53 603 43T614 25T640 16Q668 16 686 38T712 85Q717 99 720 102T735 105Q755 105 755 93Q755 75 731 36Q693 -21 641 -21H632Q571 -21 531 4T487 82Q487 109 502 166T517 239Q517 290 474 313Q459 320 449 321T378 323H309L277 193Q244 61 244 59Q244 55 245 54T252 50T269 48T302 46H333Q339 38 339 37T336 19Q332 6 326 0H311Q275 2 180 2Q146 2 117 2T71 2T50 1Q33 1 33 10Q33 12 36 24Q41 43 46 45Q50 46 61 46H67Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628Q287 635 230 637ZM630 554Q630 586 609 608T523 636Q521 636 500 636T462 637H440Q393 637 386 627Q385 624 352 494T319 361Q319 360 388 360Q466 361 492 367Q556 377 592 426Q608 449 619 486T630 554Z"></path></g><g data-mml-node="mn" transform="translate(792,363) scale(0.707)"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g></g></g></g></svg></mjx-container> es dividir la suma de cuadrados de la regresión (SSR) entre la suma de cuadrados total (SST):</p>

<header>Introducción a Regresión Lineal</header>
<ul>
<li>Los valores observados alejados de la media de <code>stage2</code> darán como resultado una suma de cuadrados alta, y los valores observados cercanos a la media darán como resultado una suma de cuadrados baja.</li>
<li>Un par de ejemplos con la ayuda de una tabla deberían proporcionar toda la transparencia que necesitamos (véase la <a href="#table-2">tabla 2</a>).</li>
