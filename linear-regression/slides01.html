<header>Introducción a Regresión Lineal</header>
<p>Es mucho más fácil usar Python como calculadora para obtener este resultado. En el siguiente fragmento de código, que requiere <code>numpy</code>, <code>**</code> es el operador exponencial. Al combinarse con el número <code>2</code>, significa que estamos elevando el resultado dentro de los paréntesis a la potencia de 2:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> numpy <span class="hljs-keyword">as</span> np
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">SST = np.<span class="hljs-built_in">sum</span>((mds[<span class="hljs-string">&#x27;stage2&#x27;</span>] - np.mean(mds[<span class="hljs-string">&#x27;stage2&#x27;</span>])) ** <span class="hljs-number">2</span>)
<span class="hljs-built_in">print</span>(SST)
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>49636.950000000004
</code></pre>

<header>Introducción a Regresión Lineal</header>
<p>Obtenemos el mismo resultado al introducir la ecuación SSR en Python, es decir, al elevar al cuadrado las diferencias entre los valores predichos para <code>stage2</code> y la media de <code>stage2</code> y sumar los resultados, siempre que ignoremos las diferencias de redondeo:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">SSR = np.<span class="hljs-built_in">sum</span>((lm.predict(x) - np.mean(mds[<span class="hljs-string">&#x27;stage2&#x27;</span>])) ** <span class="hljs-number">2</span>)
<span class="hljs-built_in">print</span>(SSR)
</code></pre>

<header>Introducción a Regresión Lineal</header>
<ul>
<li>El objeto que creamos al ajustar nuestra regresión, <code>lm</code>, contiene una variable llamada <code>fittedvalues</code>, que almacena las predicciones para la variable dependiente <code>stage2</code>.</li>
<li>Mientras que <code>yhat</code> representa predicciones que se calcularon más o menos fuera de línea al sustituir los coeficientes en la ecuación lineal, <code>fittedvalues</code> contiene las predicciones reales para <code>stage2</code> obtenidas de la regresión ajustada.</li>
<li>Son caminos ligeramente diferentes hacia el mismo destino:</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-built_in">print</span>(lm.fittedvalues)
</code></pre>

<header>Introducción a Regresión Lineal</header>
<ul>
<li>Para interpretar el estadístico <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.695ex" height="1.538ex" role="img" focusable="false" viewBox="0 -680 749 680"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D439" d="M48 1Q31 1 31 11Q31 13 34 25Q38 41 42 43T65 46Q92 46 125 49Q139 52 144 61Q146 66 215 342T285 622Q285 629 281 629Q273 632 228 634H197Q191 640 191 642T193 659Q197 676 203 680H742Q749 676 749 669Q749 664 736 557T722 447Q720 440 702 440H690Q683 445 683 453Q683 454 686 477T689 530Q689 560 682 579T663 610T626 626T575 633T503 634H480Q398 633 393 631Q388 629 386 623Q385 622 352 492L320 363H375Q378 363 398 363T426 364T448 367T472 374T489 386Q502 398 511 419T524 457T529 475Q532 480 548 480H560Q567 475 567 470Q567 467 536 339T502 207Q500 200 482 200H470Q463 206 463 212Q463 215 468 234T473 274Q473 303 453 310T364 317H309L277 190Q245 66 245 60Q245 46 334 46H359Q365 40 365 39T363 19Q359 6 353 0H336Q295 2 185 2Q120 2 86 2T48 1Z"></path></g></g></g></svg></mjx-container>, debemos compararlo con el valor crítico en <a href="https://i0.wp.com/statisticsbyjim.com/wp-content/uploads/2022/02/F-table_Alpha05.png?resize=768%2C699&ssl=1" target="_blank">una tabla <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.695ex" height="1.538ex" role="img" focusable="false" viewBox="0 -680 749 680"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D439" d="M48 1Q31 1 31 11Q31 13 34 25Q38 41 42 43T65 46Q92 46 125 49Q139 52 144 61Q146 66 215 342T285 622Q285 629 281 629Q273 632 228 634H197Q191 640 191 642T193 659Q197 676 203 680H742Q749 676 749 669Q749 664 736 557T722 447Q720 440 702 440H690Q683 445 683 453Q683 454 686 477T689 530Q689 560 682 579T663 610T626 626T575 633T503 634H480Q398 633 393 631Q388 629 386 623Q385 622 352 492L320 363H375Q378 363 398 363T426 364T448 367T472 374T489 386Q502 398 511 419T524 457T529 475Q532 480 548 480H560Q567 475 567 470Q567 467 536 339T502 207Q500 200 482 200H470Q463 206 463 212Q463 215 468 234T473 274Q473 303 453 310T364 317H309L277 190Q245 66 245 60Q245 46 334 46H359Q365 40 365 39T363 19Q359 6 353 0H336Q295 2 185 2Q120 2 86 2T48 1Z"></path></g></g></g></svg></mjx-container></a>; por sí solo, no tiene un significado inmediato.</li>
<li>Si el <strong>estadístico F es mayor</strong> que el valor crítico (véase la <a href="#figure-4-6">figura 6</a>), podemos concluir que el modelo explica una cantidad estadísticamente significativa de la varianza en la variable de respuesta.</li>
</ul>

<h2 id="prob-estad%C3%ADstico-f">Prob (estadístico f)</h2>

<ul>
<li><code>Prob</code> <code>(estadístico F)</code>, que es igual a <code>0.000107</code>, representa el valor <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.439ex;" xmlns="http://www.w3.org/2000/svg" width="1.138ex" height="1.439ex" role="img" focusable="false" viewBox="0 -442 503 636"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D45D" d="M23 287Q24 290 25 295T30 317T40 348T55 381T75 411T101 433T134 442Q209 442 230 378L240 387Q302 442 358 442Q423 442 460 395T497 281Q497 173 421 82T249 -10Q227 -10 210 -4Q199 1 187 11T168 28L161 36Q160 35 139 -51T118 -138Q118 -144 126 -145T163 -148H188Q194 -155 194 -157T191 -175Q188 -187 185 -190T172 -194Q170 -194 161 -194T127 -193T65 -192Q-5 -192 -24 -194H-32Q-39 -187 -39 -183Q-37 -156 -26 -148H-6Q28 -147 33 -136Q36 -130 94 103T155 350Q156 355 156 364Q156 405 131 405Q109 405 94 377T71 316T59 280Q57 278 43 278H29Q23 284 23 287ZM178 102Q200 26 252 26Q282 26 310 49T356 107Q374 141 392 215T411 325V331Q411 405 350 405Q339 405 328 402T306 393T286 380T269 365T254 350T243 336T235 326L232 322Q232 321 229 308T218 264T204 212Q178 106 178 102Z"></path></g></g></g></svg></mjx-container> asociado al estadístico <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.695ex" height="1.538ex" role="img" focusable="false" viewBox="0 -680 749 680"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D439" d="M48 1Q31 1 31 11Q31 13 34 25Q38 41 42 43T65 46Q92 46 125 49Q139 52 144 61Q146 66 215 342T285 622Q285 629 281 629Q273 632 228 634H197Q191 640 191 642T193 659Q197 676 203 680H742Q749 676 749 669Q749 664 736 557T722 447Q720 440 702 440H690Q683 445 683 453Q683 454 686 477T689 530Q689 560 682 579T663 610T626 626T575 633T503 634H480Q398 633 393 631Q388 629 386 623Q385 622 352 492L320 363H375Q378 363 398 363T426 364T448 367T472 374T489 386Q502 398 511 419T524 457T529 475Q532 480 548 480H560Q567 475 567 470Q567 467 536 339T502 207Q500 200 482 200H470Q463 206 463 212Q463 215 468 234T473 274Q473 303 453 310T364 317H309L277 190Q245 66 245 60Q245 46 334 46H359Q365 40 365 39T363 19Q359 6 353 0H336Q295 2 185 2Q120 2 86 2T48 1Z"></path></g></g></g></svg></mjx-container>.</li>
<li>Indica la probabilidad de observar un estadístico <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.695ex" height="1.538ex" role="img" focusable="false" viewBox="0 -680 749 680"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D439" d="M48 1Q31 1 31 11Q31 13 34 25Q38 41 42 43T65 46Q92 46 125 49Q139 52 144 61Q146 66 215 342T285 622Q285 629 281 629Q273 632 228 634H197Q191 640 191 642T193 659Q197 676 203 680H742Q749 676 749 669Q749 664 736 557T722 447Q720 440 702 440H690Q683 445 683 453Q683 454 686 477T689 530Q689 560 682 579T663 610T626 626T575 633T503 634H480Q398 633 393 631Q388 629 386 623Q385 622 352 492L320 363H375Q378 363 398 363T426 364T448 367T472 374T489 386Q502 398 511 419T524 457T529 475Q532 480 548 480H560Q567 475 567 470Q567 467 536 339T502 207Q500 200 482 200H470Q463 206 463 212Q463 215 468 234T473 274Q473 303 453 310T364 317H309L277 190Q245 66 245 60Q245 46 334 46H359Q365 40 365 39T363 19Q359 6 353 0H336Q295 2 185 2Q120 2 86 2T48 1Z"></path></g></g></g></svg></mjx-container> tan extremo, o incluso más extremo, que el calculado a partir de los datos, bajo el supuesto de que la hipótesis nula es verdadera.</li>
<li>Al modelar una relación lineal entre variables, <strong>la hipótesis nula</strong> establece que todos <strong>los coeficientes de regresión</strong>, excepto el término independiente, son <strong>iguales a cero</strong> y, por lo tanto, las variables independientes no tienen ningún efecto sobre la variable dependiente.</li>
<li>Cuando el valor <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.439ex;" xmlns="http://www.w3.org/2000/svg" width="1.138ex" height="1.439ex" role="img" focusable="false" viewBox="0 -442 503 636"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D45D" d="M23 287Q24 290 25 295T30 317T40 348T55 381T75 411T101 433T134 442Q209 442 230 378L240 387Q302 442 358 442Q423 442 460 395T497 281Q497 173 421 82T249 -10Q227 -10 210 -4Q199 1 187 11T168 28L161 36Q160 35 139 -51T118 -138Q118 -144 126 -145T163 -148H188Q194 -155 194 -157T191 -175Q188 -187 185 -190T172 -194Q170 -194 161 -194T127 -193T65 -192Q-5 -192 -24 -194H-32Q-39 -187 -39 -183Q-37 -156 -26 -148H-6Q28 -147 33 -136Q36 -130 94 103T155 350Q156 355 156 364Q156 405 131 405Q109 405 94 377T71 316T59 280Q57 278 43 278H29Q23 284 23 287ZM178 102Q200 26 252 26Q282 26 310 49T356 107Q374 141 392 215T411 325V331Q411 405 350 405Q339 405 328 402T306 393T286 380T269 365T254 350T243 336T235 326L232 322Q232 321 229 308T218 264T204 212Q178 106 178 102Z"></path></g></g></g></svg></mjx-container> del estadístico <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.695ex" height="1.538ex" role="img" focusable="false" viewBox="0 -680 749 680"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D439" d="M48 1Q31 1 31 11Q31 13 34 25Q38 41 42 43T65 46Q92 46 125 49Q139 52 144 61Q146 66 215 342T285 622Q285 629 281 629Q273 632 228 634H197Q191 640 191 642T193 659Q197 676 203 680H742Q749 676 749 669Q749 664 736 557T722 447Q720 440 702 440H690Q683 445 683 453Q683 454 686 477T689 530Q689 560 682 579T663 610T626 626T575 633T503 634H480Q398 633 393 631Q388 629 386 623Q385 622 352 492L320 363H375Q378 363 398 363T426 364T448 367T472 374T489 386Q502 398 511 419T524 457T529 475Q532 480 548 480H560Q567 475 567 470Q567 467 536 339T502 207Q500 200 482 200H470Q463 206 463 212Q463 215 468 234T473 274Q473 303 453 310T364 317H309L277 190Q245 66 245 60Q245 46 334 46H359Q365 40 365 39T363 19Q359 6 353 0H336Q295 2 185 2Q120 2 86 2T48 1Z"></path></g></g></g></svg></mjx-container> es <strong>menor que el umbral de significancia del 5%</strong>, debemos <strong>rechazar la hipótesis nula</strong> y concluir que al menos un predictor en la regresión tiene un efecto estadísticamente significativo sobre la variable dependiente.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-header="Introducción a Regresión Lineal" data-footer="Aprendizaje Estadístico" data-paginate="true" data-theme="lecture" data-marpit-pagination="73" data-marpit-pagination-total="89" style="--header:Introducción a Regresión Lineal;--footer:Aprendizaje Estadístico;--paginate:true;--theme:lecture;">
<header>Introducción a Regresión Lineal</header>
<h2 id=""><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.564ex;" xmlns="http://www.w3.org/2000/svg" width="6.791ex" height="2.26ex" role="img" focusable="false" viewBox="0 -749.5 3001.6 999"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D443" d="M287 628Q287 635 230 637Q206 637 199 638T192 648Q192 649 194 659Q200 679 203 681T397 683Q587 682 600 680Q664 669 707 631T751 530Q751 453 685 389Q616 321 507 303Q500 302 402 301H307L277 182Q247 66 247 59Q247 55 248 54T255 50T272 48T305 46H336Q342 37 342 35Q342 19 335 5Q330 0 319 0Q316 0 282 1T182 2Q120 2 87 2T51 1Q33 1 33 11Q33 13 36 25Q40 41 44 43T67 46Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628ZM645 554Q645 567 643 575T634 597T609 619T560 635Q553 636 480 637Q463 637 445 637T416 636T404 636Q391 635 386 627Q384 621 367 550T332 412T314 344Q314 342 395 342H407H430Q542 342 590 392Q617 419 631 471T645 554Z"></path></g><g data-mml-node="mo" transform="translate(1028.8,0)"><path data-c="3E" d="M84 520Q84 528 88 533T96 539L99 540Q106 540 253 471T544 334L687 265Q694 260 694 250T687 235Q685 233 395 96L107 -40H101Q83 -38 83 -20Q83 -19 83 -17Q82 -10 98 -1Q117 9 248 71Q326 108 378 132L626 250L378 368Q90 504 86 509Q84 513 84 520Z"></path></g><g data-mml-node="mo" transform="translate(2084.6,0) translate(0 -0.5)"><path data-c="7C" d="M139 -249H137Q125 -249 119 -235V251L120 737Q130 750 139 750Q152 750 159 735V-235Q151 -249 141 -249H139Z"></path></g><g data-mml-node="mi" transform="translate(2362.6,0)"><path data-c="1D461" d="M26 385Q19 392 19 395Q19 399 22 411T27 425Q29 430 36 430T87 431H140L159 511Q162 522 166 540T173 566T179 586T187 603T197 615T211 624T229 626Q247 625 254 615T261 596Q261 589 252 549T232 470L222 433Q222 431 272 431H323Q330 424 330 420Q330 398 317 385H210L174 240Q135 80 135 68Q135 26 162 26Q197 26 230 60T283 144Q285 150 288 151T303 153H307Q322 153 322 145Q322 142 319 133Q314 117 301 95T267 48T216 6T155 -11Q125 -11 98 4T59 56Q57 64 57 83V101L92 241Q127 382 128 383Q128 385 77 385H26Z"></path></g><g data-mml-node="mo" transform="translate(2723.6,0) translate(0 -0.5)"><path data-c="7C" d="M139 -249H137Q125 -249 119 -235V251L120 737Q130 750 139 750Q152 750 159 735V-235Q151 -249 141 -249H139Z"></path></g></g></g></svg></mjx-container></h2>
<ul>
<li><code>P&gt;|t|</code> representa el valor <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.439ex;" xmlns="http://www.w3.org/2000/svg" width="1.138ex" height="1.439ex" role="img" focusable="false" viewBox="0 -442 503 636"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D45D" d="M23 287Q24 290 25 295T30 317T40 348T55 381T75 411T101 433T134 442Q209 442 230 378L240 387Q302 442 358 442Q423 442 460 395T497 281Q497 173 421 82T249 -10Q227 -10 210 -4Q199 1 187 11T168 28L161 36Q160 35 139 -51T118 -138Q118 -144 126 -145T163 -148H188Q194 -155 194 -157T191 -175Q188 -187 185 -190T172 -194Q170 -194 161 -194T127 -193T65 -192Q-5 -192 -24 -194H-32Q-39 -187 -39 -183Q-37 -156 -26 -148H-6Q28 -147 33 -136Q36 -130 94 103T155 350Q156 355 156 364Q156 405 131 405Q109 405 94 377T71 316T59 280Q57 278 43 278H29Q23 284 23 287ZM178 102Q200 26 252 26Q282 26 310 49T356 107Q374 141 392 215T411 325V331Q411 405 350 405Q339 405 328 402T306 393T286 380T269 365T254 350T243 336T235 326L232 322Q232 321 229 308T218 264T204 212Q178 106 178 102Z"></path></g></g></g></svg></mjx-container> para cada predictor.</li>
<li>El valor <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.439ex;" xmlns="http://www.w3.org/2000/svg" width="1.138ex" height="1.439ex" role="img" focusable="false" viewBox="0 -442 503 636"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D45D" d="M23 287Q24 290 25 295T30 317T40 348T55 381T75 411T101 433T134 442Q209 442 230 378L240 387Q302 442 358 442Q423 442 460 395T497 281Q497 173 421 82T249 -10Q227 -10 210 -4Q199 1 187 11T168 28L161 36Q160 35 139 -51T118 -138Q118 -144 126 -145T163 -148H188Q194 -155 194 -157T191 -175Q188 -187 185 -190T172 -194Q170 -194 161 -194T127 -193T65 -192Q-5 -192 -24 -194H-32Q-39 -187 -39 -183Q-37 -156 -26 -148H-6Q28 -147 33 -136Q36 -130 94 103T155 350Q156 355 156 364Q156 405 131 405Q109 405 94 377T71 316T59 280Q57 278 43 278H29Q23 284 23 287ZM178 102Q200 26 252 26Q282 26 310 49T356 107Q374 141 392 215T411 325V331Q411 405 350 405Q339 405 328 402T306 393T286 380T269 365T254 350T243 336T235 326L232 322Q232 321 229 308T218 264T204 212Q178 106 178 102Z"></path></g></g></g></svg></mjx-container> para <code>stage1</code> es igual a <code>0.000</code>, por lo que es estadísticamente significativo.</li>
<li>Si en cambio hubiéramos ajustado una regresión múltiple con una combinación de predictores significativos e insignificantes, necesitaríamos equilibrar la complejidad del modelo con el poder explicativo.</li>
<li>El enfoque preferido en este caso es ajustar un modelo reducido que incluya solo los predictores estadísticamente significativos, simplificando el modelo y conservando sus variables explicativas más relevantes.</li>
</ul>
<footer>Aprendizaje Estadístico</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="74" data-header="Introducción a Regresión Lineal" data-footer="Aprendizaje Estadístico" data-paginate="true" data-theme="lecture" data-marpit-pagination="74" data-marpit-pagination-total="89" style="--header:Introducción a Regresión Lineal;--footer:Aprendizaje Estadístico;--paginate:true;--theme:lecture;">
<header>Introducción a Regresión Lineal</header>
<h1 id="prueba-de-supuestos-del-modelo">Prueba de supuestos del modelo</h1>
<p>Una vez ajustada la regresión y evaluadas las medidas clave, se deben realizar una serie de pruebas para confirmar (con suerte) la fiabilidad de los resultados. Debemos poner en pausa nuestra confianza en el resultado del modelo hasta que hayamos comprobado y validado todos los supuestos de la regresión lineal.</p>
<ol>
<li>Linealidad entre variables</li>
<li>Independencia de los residuos</li>
<li>Homocedasticidad de los residuos</li>
<li>Normalidad de los residuos</li>
</ol>
<footer>Aprendizaje Estadístico</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="75" data-header="Introducción a Regresión Lineal" data-footer="Aprendizaje Estadístico" data-paginate="true" data-theme="lecture" data-marpit-pagination="75" data-marpit-pagination-total="89" style="--header:Introducción a Regresión Lineal;--footer:Aprendizaje Estadístico;--paginate:true;--theme:lecture;">
<header>Introducción a Regresión Lineal</header>
<h2 id="supuesto-1-linealidad-entre-variables">Supuesto 1: Linealidad entre variables</h2>
<ul>
<li>Debe existir una relación lineal entre las variables independientes y dependientes.</li>
<li>Se asume que la relación se representa adecuadamente mediante una línea recta, de modo que los cambios en la variable predictora provocan cambios proporcionales, positivos o negativos, en la variable de respuesta.</li>
<li>Si bien el <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.048ex;" xmlns="http://www.w3.org/2000/svg" width="2.705ex" height="1.934ex" role="img" focusable="false" viewBox="0 -833.9 1195.6 854.9"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mi"><path data-c="1D445" d="M230 637Q203 637 198 638T193 649Q193 676 204 682Q206 683 378 683Q550 682 564 680Q620 672 658 652T712 606T733 563T739 529Q739 484 710 445T643 385T576 351T538 338L545 333Q612 295 612 223Q612 212 607 162T602 80V71Q602 53 603 43T614 25T640 16Q668 16 686 38T712 85Q717 99 720 102T735 105Q755 105 755 93Q755 75 731 36Q693 -21 641 -21H632Q571 -21 531 4T487 82Q487 109 502 166T517 239Q517 290 474 313Q459 320 449 321T378 323H309L277 193Q244 61 244 59Q244 55 245 54T252 50T269 48T302 46H333Q339 38 339 37T336 19Q332 6 326 0H311Q275 2 180 2Q146 2 117 2T71 2T50 1Q33 1 33 10Q33 12 36 24Q41 43 46 45Q50 46 61 46H67Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628Q287 635 230 637ZM630 554Q630 586 609 608T523 636Q521 636 500 636T462 637H440Q393 637 386 627Q385 624 352 494T319 361Q319 360 388 360Q466 361 492 367Q556 377 592 426Q608 449 619 486T630 554Z"></path></g><g data-mml-node="mn" transform="translate(792,363) scale(0.707)"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g></g></g></g></svg></mjx-container> mide la proporción de la varianza de la variable dependiente explicada por el modelo, no confirma si la relación entre las variables es realmente lineal.</li>
<li>Un valor alto de <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.048ex;" xmlns="http://www.w3.org/2000/svg" width="2.705ex" height="1.934ex" role="img" focusable="false" viewBox="0 -833.9 1195.6 854.9"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mi"><path data-c="1D445" d="M230 637Q203 637 198 638T193 649Q193 676 204 682Q206 683 378 683Q550 682 564 680Q620 672 658 652T712 606T733 563T739 529Q739 484 710 445T643 385T576 351T538 338L545 333Q612 295 612 223Q612 212 607 162T602 80V71Q602 53 603 43T614 25T640 16Q668 16 686 38T712 85Q717 99 720 102T735 105Q755 105 755 93Q755 75 731 36Q693 -21 641 -21H632Q571 -21 531 4T487 82Q487 109 502 166T517 239Q517 290 474 313Q459 320 449 321T378 323H309L277 193Q244 61 244 59Q244 55 245 54T252 50T269 48T302 46H333Q339 38 339 37T336 19Q332 6 326 0H311Q275 2 180 2Q146 2 117 2T71 2T50 1Q33 1 33 10Q33 12 36 24Q41 43 46 45Q50 46 61 46H67Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628Q287 635 230 637ZM630 554Q630 586 609 608T523 636Q521 636 500 636T462 637H440Q393 637 386 627Q385 624 352 494T319 361Q319 360 388 360Q466 361 492 367Q556 377 592 426Q608 449 619 486T630 554Z"></path></g><g data-mml-node="mn" transform="translate(792,363) scale(0.707)"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g></g></g></g></svg></mjx-container> podría presentarse incluso en casos donde existe una relación no lineal, por lo que resulta esencial utilizar métodos visuales.</li>
</ul>
<footer>Aprendizaje Estadístico</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="76" data-header="Introducción a Regresión Lineal" data-footer="Aprendizaje Estadístico" data-paginate="true" data-theme="lecture" data-marpit-pagination="76" data-marpit-pagination-total="89" style="--header:Introducción a Regresión Lineal;--footer:Aprendizaje Estadístico;--paginate:true;--theme:lecture;">

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">plt.scatter(lm.fittedvalues, lm.resid)

<header>Introducción a Regresión Lineal</header>
<h2 id="supuesto-2-independencia-de-los-residuos">Supuesto 2: Independencia de los residuos</h2>
<ul>
<li>Se asume que los residuos son independientes entre sí; se supone que no existe correlación entre ellos.</li>
<li>La correlación entre los residuos se refiere específicamente al grado de relación entre los errores de la regresión lineal.</li>
<li>Una correlación significativa entre los residuos podría indicar que el modelo de regresión no detectó algún patrón sistemático en los datos.</li>
</ul>
<footer>Aprendizaje Estadístico</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="79" data-header="Introducción a Regresión Lineal" data-footer="Aprendizaje Estadístico" data-paginate="true" data-theme="lecture" data-marpit-pagination="79" data-marpit-pagination-total="89" style="--header:Introducción a Regresión Lineal;--footer:Aprendizaje Estadístico;--paginate:true;--theme:lecture;">
<header>Introducción a Regresión Lineal</header>
<ul>
<li>La <a href="https://en.wikipedia.org/wiki/Durbin%E2%80%93Watson_statistic" target="_blank">prueba de Durbin-Watson</a> es un método estadístico que se utiliza para detectar la correlación en los residuos de un modelo de regresión.
<ul>
<li>Proporciona un estadístico de prueba que oscila entre 0 y 4</li>
<li>Ayuda a determinar si debemos rechazar la hipótesis nula de ausencia de correlación.</li>
<li>Cuando el estadístico de prueba se encuentra entre 1.5 y 2.5, generalmente <strong>no se rechaza la hipótesis nula</strong>, lo que indica que es probable que se cumpla el supuesto de residuos independientes.</li>
<li>Si el estadístico se encuentra fuera de este rango, podemos rechazar la hipótesis nula, lo que sugiere una posible correlación en los residuos.</li>
<li>Cuanto más cerca esté el estadístico de prueba de los extremos (0 o 4), mayor será la evidencia de correlación positiva o negativa, respectivamente.</li>
</ul>
</li>
</ul>
<footer>Aprendizaje Estadístico</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="80" data-header="Introducción a Regresión Lineal" data-footer="Aprendizaje Estadístico" data-paginate="true" data-theme="lecture" data-marpit-pagination="80" data-marpit-pagination-total="89" style="--header:Introducción a Regresión Lineal;--footer:Aprendizaje Estadístico;--paginate:true;--theme:lecture;">
<header>Introducción a Regresión Lineal</header>
<ul>
<li>El <a href="https://en.wikipedia.org/wiki/Durbin%E2%80%93Watson_statistic" target="_blank">estadístico de prueba de Durbin-Watson</a> se calcula como la razón entre las diferencias al cuadrado de los residuos sucesivos (numerador) y la suma total de los residuos al cuadrado (denominador).</li>
<li>En la tabla de regresión, el estadístico de Durbin-Watson se muestra como 2.326, lo que nos permite concluir que no debemos rechazar la hipótesis nula y que se cumple el supuesto de independencia de los residuos</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> statsmodels.stats.stattools <span class="hljs-keyword">import</span> durbin_watson
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-built_in">print</span>(durbin_watson(lm.resid))
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>2.3264601831112186
</code></pre>
<footer>Aprendizaje Estadístico</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="81" data-header="Introducción a Regresión Lineal" data-footer="Aprendizaje Estadístico" data-paginate="true" data-theme="lecture" data-marpit-pagination="81" data-marpit-pagination-total="89" style="--header:Introducción a Regresión Lineal;--footer:Aprendizaje Estadístico;--paginate:true;--theme:lecture;">
<header>Introducción a Regresión Lineal</header>
<h2 id="supuesto-3-homocedasticidad-de-los-residuos">Supuesto 3: Homocedasticidad de los residuos</h2>
<ul>
<li>Se asume que los residuos son homocedásticos y, por lo tanto, no heterocedásticos.</li>
<li>La homocedasticidad se refiere a la expectativa de que la variabilidad, o dispersión, de los residuos sea consistente en todos los niveles de las variables predictoras; es decir, la dispersión de los residuos no debería aumentar ni disminuir a medida que cambian los valores de las variables predictoras.</li>
<li>Esta suposición es importante porque la heterocedasticidad puede conducir a estimaciones ineficientes y errores estándar sesgados, lo que a su vez puede distorsionar las pruebas de hipótesis y los intervalos de confianza.</li>
<li>Si la varianza de los residuos aumenta o disminuye sistemáticamente, se debilita la fiabilidad de las inferencias del modelo, lo que aumenta la probabilidad de aceptar o rechazar incorrectamente la significación estadística.</li>
</ul>
<footer>Aprendizaje Estadístico</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="82" data-header="Introducción a Regresión Lineal" data-footer="Aprendizaje Estadístico" data-paginate="true" data-theme="lecture" data-marpit-pagination="82" data-marpit-pagination-total="89" style="--header:Introducción a Regresión Lineal;--footer:Aprendizaje Estadístico;--paginate:true;--theme:lecture;">
<header>Introducción a Regresión Lineal</header>
<ul>
<li>La <a href="https://en.wikipedia.org/wiki/Breusch%E2%80%93Pagan_test" target="_blank">prueba de Breusch-Pagan</a> es un método estadístico para detectar la heterocedasticidad en los residuos de un modelo de regresión o, alternativamente, si los residuos presentan varianza constante (homocedasticidad) entre las observaciones.</li>
<li>La prueba funciona evaluando si la varianza de los residuos depende sistemáticamente de los valores de las variables independientes.</li>
<li>La <strong>hipótesis nula</strong> es que los residuos <strong>son homocedásticos</strong>.</li>
</ul>
<footer>Aprendizaje Estadístico</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="83" data-header="Introducción a Regresión Lineal" data-footer="Aprendizaje Estadístico" data-paginate="true" data-theme="lecture" data-marpit-pagination="83" data-marpit-pagination-total="89" style="--header:Introducción a Regresión Lineal;--footer:Aprendizaje Estadístico;--paginate:true;--theme:lecture;">
<header>Introducción a Regresión Lineal</header>
<p>El <a href="https://en.wikipedia.org/wiki/Breusch%E2%80%93Pagan_test" target="_blank">estadístico de prueba de Breusch-Pagan</a> se calcula mediante la regresión de los residuos al cuadrado del modelo de regresión original sobre las variables independientes y el análisis de la varianza explicada en esta regresión auxiliar. El estadístico de prueba es proporcional a la varianza explicada en esta segunda regresión; un valor alto indica que la varianza de los residuos puede depender de los valores de las variables predictoras, lo que sugiere heterocedasticidad.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> statsmodels.stats.diagnostic <span class="hljs-keyword">import</span> het_breuschpagan
</code></pre>
<p>Luego, pase los residuos (<code>lm.resid</code>) y las variables independientes (<code>lm.model.exog</code>) del modelo de regresión ajustado al método <code>het_breuschpagan()</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">lm_BreuschPagan = het_breuschpagan(lm.resid, lm.model.exog)
</code></pre>
<footer>Aprendizaje Estadístico</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="84" data-header="Introducción a Regresión Lineal" data-footer="Aprendizaje Estadístico" data-paginate="true" data-theme="lecture" data-marpit-pagination="84" data-marpit-pagination-total="89" style="--header:Introducción a Regresión Lineal;--footer:Aprendizaje Estadístico;--paginate:true;--theme:lecture;">
<header>Introducción a Regresión Lineal</header>
<p>El método <code>het_breuschpagan()</code> calcula el estadístico de prueba, el valor <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.439ex;" xmlns="http://www.w3.org/2000/svg" width="1.138ex" height="1.439ex" role="img" focusable="false" viewBox="0 -442 503 636"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D45D" d="M23 287Q24 290 25 295T30 317T40 348T55 381T75 411T101 433T134 442Q209 442 230 378L240 387Q302 442 358 442Q423 442 460 395T497 281Q497 173 421 82T249 -10Q227 -10 210 -4Q199 1 187 11T168 28L161 36Q160 35 139 -51T118 -138Q118 -144 126 -145T163 -148H188Q194 -155 194 -157T191 -175Q188 -187 185 -190T172 -194Q170 -194 161 -194T127 -193T65 -192Q-5 -192 -24 -194H-32Q-39 -187 -39 -183Q-37 -156 -26 -148H-6Q28 -147 33 -136Q36 -130 94 103T155 350Q156 355 156 364Q156 405 131 405Q109 405 94 377T71 316T59 280Q57 278 43 278H29Q23 284 23 287ZM178 102Q200 26 252 26Q282 26 310 49T356 107Q374 141 392 215T411 325V331Q411 405 350 405Q339 405 328 402T306 393T286 380T269 365T254 350T243 336T235 326L232 322Q232 321 229 308T218 264T204 212Q178 106 178 102Z"></path></g></g></g></svg></mjx-container> y detalles adicionales de la prueba, devolviéndolos como una tupla. Dado que nos interesa principalmente el valor p para evaluar la presencia de heterocedasticidad, podemos usar <code>print()</code> para mostrar solo el segundo elemento de la tupla, que es el valor <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.439ex;" xmlns="http://www.w3.org/2000/svg" width="1.138ex" height="1.439ex" role="img" focusable="false" viewBox="0 -442 503 636"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D45D" d="M23 287Q24 290 25 295T30 317T40 348T55 381T75 411T101 433T134 442Q209 442 230 378L240 387Q302 442 358 442Q423 442 460 395T497 281Q497 173 421 82T249 -10Q227 -10 210 -4Q199 1 187 11T168 28L161 36Q160 35 139 -51T118 -138Q118 -144 126 -145T163 -148H188Q194 -155 194 -157T191 -175Q188 -187 185 -190T172 -194Q170 -194 161 -194T127 -193T65 -192Q-5 -192 -24 -194H-32Q-39 -187 -39 -183Q-37 -156 -26 -148H-6Q28 -147 33 -136Q36 -130 94 103T155 350Q156 355 156 364Q156 405 131 405Q109 405 94 377T71 316T59 280Q57 278 43 278H29Q23 284 23 287ZM178 102Q200 26 252 26Q282 26 310 49T356 107Q374 141 392 215T411 325V331Q411 405 350 405Q339 405 328 402T306 393T286 380T269 365T254 350T243 336T235 326L232 322Q232 321 229 308T218 264T204 212Q178 106 178 102Z"></path></g></g></g></svg></mjx-container>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-built_in">print</span>(lm_BreuschPagan[<span class="hljs-number">1</span>])
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>0.181071316321208
</code></pre>
<p>En este caso, el valor <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.439ex;" xmlns="http://www.w3.org/2000/svg" width="1.138ex" height="1.439ex" role="img" focusable="false" viewBox="0 -442 503 636"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D45D" d="M23 287Q24 290 25 295T30 317T40 348T55 381T75 411T101 433T134 442Q209 442 230 378L240 387Q302 442 358 442Q423 442 460 395T497 281Q497 173 421 82T249 -10Q227 -10 210 -4Q199 1 187 11T168 28L161 36Q160 35 139 -51T118 -138Q118 -144 126 -145T163 -148H188Q194 -155 194 -157T191 -175Q188 -187 185 -190T172 -194Q170 -194 161 -194T127 -193T65 -192Q-5 -192 -24 -194H-32Q-39 -187 -39 -183Q-37 -156 -26 -148H-6Q28 -147 33 -136Q36 -130 94 103T155 350Q156 355 156 364Q156 405 131 405Q109 405 94 377T71 316T59 280Q57 278 43 278H29Q23 284 23 287ZM178 102Q200 26 252 26Q282 26 310 49T356 107Q374 141 392 215T411 325V331Q411 405 350 405Q339 405 328 402T306 393T286 380T269 365T254 350T243 336T235 326L232 322Q232 321 229 308T218 264T204 212Q178 106 178 102Z"></path></g></g></g></svg></mjx-container> es mayor que el 5%, por lo que no rechazamos la hipótesis nula y concluimos que se ha cumplido el supuesto de homocedasticidad (varianza constante en los residuos).</p>
<footer>Aprendizaje Estadístico</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="85" data-header="Introducción a Regresión Lineal" data-footer="Aprendizaje Estadístico" data-paginate="true" data-theme="lecture" data-marpit-pagination="85" data-marpit-pagination-total="89" style="--header:Introducción a Regresión Lineal;--footer:Aprendizaje Estadístico;--paginate:true;--theme:lecture;">
<header>Introducción a Regresión Lineal</header>
<h1 id="supuesto-4-normalidad-de-los-residuos">Supuesto  4: Normalidad de los residuos</h1>
<ul>
<li>Se asume que los residuos siguen una distribución normal.</li>
<li>Si no se cumple este supuesto, la integridad de las estimaciones de los coeficientes y la significancia de los predictores pueden verse afectadas.</li>
<li>Existen dos enfoques principales para comprobarlo: un método visual y subjetivo, y una prueba estadística más precisa.</li>
<li>En un gráfico Q-Q, los residuos se representan mediante puntos y se comparan con una distribución perfectamente normal, representada por una línea discontinua a 45 grados.</li>
<li>Si los residuos siguen una distribución normal, los puntos deberían alinearse aproximadamente a lo largo de esta línea.</li>
</ul>
<footer>Aprendizaje Estadístico</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="86" data-header="Introducción a Regresión Lineal" data-footer="Aprendizaje Estadístico" data-paginate="true" data-theme="lecture" data-marpit-pagination="86" data-marpit-pagination-total="89" style="--header:Introducción a Regresión Lineal;--footer:Aprendizaje Estadístico;--paginate:true;--theme:lecture;">
<header>Introducción a Regresión Lineal</header>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">stats.probplot(
    lm.resid, 
    dist = <span class="hljs-string">&#x27;norm&#x27;</span>, 
    plot = plt
    )
plt.gca().get_lines()[<span class="hljs-number">1</span>].set_linestyle(<span class="hljs-string">&#x27;--&#x27;</span>)
plt.title(<span class="hljs-string">&#x27;Q-Q Plot&#x27;</span>)
plt.show()
</code></pre>
<ul>
<li>Verás el gráfico Q-Q en la <a href="#figure-4-8">figura 8</a>, indica visualmente el grado de normalidad de los residuos.</li>
<li>El gráfico Q-Q muestra que los residuos se desvían de la línea de normalidad, especialmente en las colas, lo que sugiere que podrían no estar distribuidos normalmente.</li>
</ul>
<footer>Aprendizaje Estadístico</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="87" data-header="Introducción a Regresión Lineal" data-footer="Aprendizaje Estadístico" data-paginate="true" data-theme="lecture" data-marpit-pagination="87" data-marpit-pagination-total="89" style="--header:Introducción a Regresión Lineal;--footer:Aprendizaje Estadístico;--paginate:true;--theme:lecture;">
<header>Introducción a Regresión Lineal</header>
<img id="figure-4-8" src="https://drek4537l1klr.cloudfront.net/sutton2/Figures/CH04_F08_Sutton2.png" class="center" width="700" height="700" />
<footer>Aprendizaje Estadístico</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="88" data-header="Introducción a Regresión Lineal" data-footer="Aprendizaje Estadístico" data-paginate="true" data-theme="lecture" data-marpit-pagination="88" data-marpit-pagination-total="89" style="--header:Introducción a Regresión Lineal;--footer:Aprendizaje Estadístico;--paginate:true;--theme:lecture;">
<header>Introducción a Regresión Lineal</header>
<ul>
<li>La <a href="https://en.wikipedia.org/wiki/Jarque%E2%80%93Bera_test" target="_blank">prueba de Jarque-Bera</a> calcula su estadístico midiendo la <a href="https://www.geeksforgeeks.org/data-science/difference-between-skewness-and-kurtosis/" target="_blank">asimetría y la curtosis</a> (es decir, la simetría y el grosor de la cola) en la distribución de los residuos.</li>
<li>La <strong>hipótesis nula</strong> es que los datos siguen una <strong>distribución normal</strong>. Si la prueba arroja un valor <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.439ex;" xmlns="http://www.w3.org/2000/svg" width="1.138ex" height="1.439ex" role="img" focusable="false" viewBox="0 -442 503 636"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D45D" d="M23 287Q24 290 25 295T30 317T40 348T55 381T75 411T101 433T134 442Q209 442 230 378L240 387Q302 442 358 442Q423 442 460 395T497 281Q497 173 421 82T249 -10Q227 -10 210 -4Q199 1 187 11T168 28L161 36Q160 35 139 -51T118 -138Q118 -144 126 -145T163 -148H188Q194 -155 194 -157T191 -175Q188 -187 185 -190T172 -194Q170 -194 161 -194T127 -193T65 -192Q-5 -192 -24 -194H-32Q-39 -187 -39 -183Q-37 -156 -26 -148H-6Q28 -147 33 -136Q36 -130 94 103T155 350Q156 355 156 364Q156 405 131 405Q109 405 94 377T71 316T59 280Q57 278 43 278H29Q23 284 23 287ZM178 102Q200 26 252 26Q282 26 310 49T356 107Q374 141 392 215T411 325V331Q411 405 350 405Q339 405 328 402T306 393T286 380T269 365T254 350T243 336T235 326L232 322Q232 321 229 308T218 264T204 212Q178 106 178 102Z"></path></g></g></g></svg></mjx-container> inferior al 5%, se rechaza la hipótesis nula y se concluye que los residuos no siguen una distribución normal.</li>
<li>A continuación, se explica cómo calcularlo directamente a partir de los residuos:</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> statsmodels.stats.stattools <span class="hljs-keyword">import</span> jarque_bera 
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-built_in">print</span>(jarque_bera(lm.resid)) 
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>SignificanceResult(statistic=2.150037983280995, pvalue=0.34129127355827205)
</code></pre>
<footer>Aprendizaje Estadístico</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="89" data-header="Introducción a Regresión Lineal" data-footer="Aprendizaje Estadístico" data-paginate="true" data-theme="lecture" data-marpit-pagination="89" data-marpit-pagination-total="89" style="--header:Introducción a Regresión Lineal;--footer:Aprendizaje Estadístico;--paginate:true;--theme:lecture;">
<header>Introducción a Regresión Lineal</header>
<h1 id="conclusi%C3%B3n">Conclusión</h1>
<ul>
<li>Si estuviéramos ajustando una regresión lineal múltiple, necesitaríamos comprobar un supuesto adicional: que las variables predictoras no estén altamente correlacionadas entre sí, lo que se conoce como multicolinealidad.</li>
<li>Una multicolinealidad excesiva puede provocar sobreajuste, por lo que podría ser necesario reducir el modelo eliminando las variables predictoras redundantes.</li>
<li>Hemos demostrado la regresión lineal tanto en teoría como en la práctica.</li>
<li>Hemos establecido una base sólida para aprender otras técnicas de modelado.</li>
</ul>
<footer>Aprendizaje Estadístico</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="90" data-header="Introducción a Regresión Lineal" data-footer="Aprendizaje Estadístico" data-paginate="skip" data-class="title" data-theme="lecture" class="title" style="--header:Introducción a Regresión Lineal;--footer:Aprendizaje Estadístico;--paginate:skip;--class:title;--theme:lecture;">
